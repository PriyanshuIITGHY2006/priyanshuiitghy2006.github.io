    <!-- Structured data so Google can show a Person knowledge-panel-style result. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Priyanshu Debnath",
        "url": "https://priyanshuiitghy2006.github.io/",
        "image": "https://priyanshuiitghy2006.github.io/profile.jpg",
        "jobTitle": "B.Tech Student, Electronics and Electrical Engineering",
        "affiliation": {
          "@type": "CollegeOrUniversity",
          "name": "Indian Institute of Technology, Guwahati"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Indian Institute of Technology, Guwahati"
        },
        "sameAs": [
          "https://github.com/PriyanshuIITGHY2006",
          "https://linkedin.com/in/priyanshu-debnath-3a81711b3",
          "https://codeforces.com/profile/PriyanshuIITGHY2006"
        ]
      }
    </script>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script>
      // Set the theme before first paint so there's no flash of the wrong
      // theme — kept in sync with src/lib/theme.ts's storage key/logic.
      (function () {
        try {
          var stored = localStorage.getItem("site-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
