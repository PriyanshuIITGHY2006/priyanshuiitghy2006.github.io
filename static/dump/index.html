<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>dump | Priyanshu Debnath</title>
<link rel="icon" href="/favicon.ico">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('pref-theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
:root{--theme:#f6f3ec;--entry:#f6f3ec;--primary:#25221e;--secondary:#6e685e;--tertiary:#e3ddd0;--content:#2b2824;--code-bg:#ece7dc;--border:#e3ddd0;--accent:#9a3412;--radius:8px;--ok:#3f6212;--bad:#b91c1c;color-scheme:light;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Open Sans","Helvetica Neue",sans-serif;
--mono:ui-monospace,"JetBrains Mono","Cascadia Code","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
:root[data-theme="dark"]{--theme:#1b1816;--entry:#1b1816;--primary:#ece6df;--secondary:#a39a90;--tertiary:#3a342f;--content:#d9d2ca;--code-bg:#2a2522;--border:#2e2925;--accent:#e0a458;--ok:#a3e635;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--theme);color:var(--content);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:60px;padding:0 24px;max-width:1500px;width:100%;margin:0 auto}
.brand{font-size:22px;font-weight:700;color:var(--primary);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.here{font:14px var(--mono);color:var(--accent)}
.sp{flex:1}
button,select,.btn{font:13px var(--sans);color:var(--primary);background:transparent;border:1px solid var(--border);border-radius:6px;padding:5px 11px;cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.4}
button:hover,.btn:hover,select:hover{border-color:var(--secondary)}
button.pri{background:var(--primary);border-color:var(--primary);color:var(--theme)}
button.pri:hover{opacity:.88}
button.bad:hover{color:var(--bad);border-color:var(--bad)}
select{background:var(--theme)}
.icon{display:inline-flex;padding:6px;border:0}
.icon svg{width:18px;height:18px}
:root[data-theme="dark"] .moon,:root:not([data-theme="dark"]) .sun{display:none}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,36%) 1fr;gap:16px;padding:0 24px 24px;max-width:1500px;width:100%;margin:0 auto}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);background:var(--entry);overflow:hidden}
.prompt{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);font:14px var(--mono)}
.prompt b{color:var(--accent);font-weight:700}
.prompt input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--primary);font:inherit}
.prompt input::placeholder{color:var(--secondary);opacity:.7}
#count{color:var(--secondary);font-size:12px}
#tree{flex:1;overflow:auto;padding:6px 0;font:13.5px/1.2 var(--mono)}
.row{display:flex;align-items:center;gap:7px;padding:5px 14px 5px 11px;border-left:3px solid transparent;cursor:pointer;color:var(--content);white-space:nowrap}
.row:hover{background:var(--code-bg)}
.row.sel{background:var(--code-bg);border-left-color:var(--accent);color:var(--primary);font-weight:600}
.caret{flex:0 0 10px;width:10px;color:var(--secondary);font-size:10px;text-align:center;transition:transform .12s}
.row.open>.caret{transform:rotate(90deg)}
.ico{flex:0 0 15px;width:15px;height:15px;color:var(--secondary)}
.row.dir>.ico{color:var(--accent)}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nm i{font-style:normal;color:var(--secondary);font-weight:400}
.sz{color:var(--secondary);font-size:11.5px;font-weight:400}
.lock{flex:0 0 auto;font:10px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--secondary);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-weight:400}
.note{padding:28px 16px;text-align:center;color:var(--secondary);font:14px var(--sans)}
#bar{display:none;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--border)}
body.admin #bar{display:flex}
#into{flex:1 1 100%;font:12px var(--mono);color:var(--secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#into span{color:var(--primary)}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--border);min-height:49px}
.ptitle{flex:1 1 220px;min-width:0}
.ppath{font:14px var(--mono);color:var(--secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppath strong{color:var(--accent);font-weight:600}
.pmeta{font-size:12px;color:var(--secondary)}
.pmeta .pub{color:var(--ok)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button,.acts .btn{padding:4px 9px;font-size:12px}
#pbody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
#pbody iframe{flex:1;width:100%;min-height:360px;border:0;background:var(--theme)}
.ls{padding:12px 16px;font:13.5px/1.75 var(--mono);white-space:pre}
.ls a{text-decoration:none;color:var(--content);cursor:pointer}
.ls a:hover{text-decoration:underline;text-underline-offset:3px}
.ls a.d{color:var(--accent);font-weight:600}
.ls .t{color:var(--secondary);opacity:.55}
.ls .m{color:var(--secondary);font-size:12px}
#drop{position:fixed;inset:12px;display:none;align-items:center;justify-content:center;border:2px dashed var(--accent);border-radius:var(--radius);background:color-mix(in srgb,var(--theme) 86%,var(--accent));font:600 18px var(--sans);color:var(--primary);z-index:30;pointer-events:none}
#drop.on{display:flex}
#ups{position:fixed;right:20px;bottom:20px;width:min(340px,calc(100vw - 40px));display:flex;flex-direction:column;gap:8px;z-index:20}
.up{background:var(--theme);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;box-shadow:0 6px 22px rgba(0,0,0,.18)}
.up div{font:13px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--primary)}
.up small{color:var(--secondary)}
.up.err small{color:var(--bad)}
.up .track{height:4px;margin-top:7px;border-radius:2px;background:var(--code-bg);overflow:hidden}
.up .fill{height:100%;width:0;background:var(--accent);transition:width .2s}
.up button{margin-top:8px;padding:3px 8px;font-size:12px}
dialog{border:1px solid var(--border);border-radius:var(--radius);background:var(--theme);color:var(--content);padding:20px;width:min(380px,calc(100vw - 32px));box-shadow:0 12px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 6px;font-size:17px;color:var(--primary)}
dialog p{margin:0 0 12px;color:var(--secondary);font-size:14px;overflow-wrap:anywhere}
dialog input{width:100%;font:14px var(--mono);padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--code-bg);color:var(--primary);outline:0;margin-bottom:14px}
dialog input:focus{border-color:var(--accent)}
.dbtn{display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--primary);color:var(--theme);padding:7px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none}
#toast.on{opacity:1}
@media (max-width:820px){
  body{height:auto;min-height:100%}
  header{padding:0 14px}
  .brand{font-size:18px}
  .wrap{grid-template-columns:1fr;padding:0 14px 90px;gap:12px}
  #tree{max-height:44vh}
  #pbody iframe{min-height:70vh}
}
</style>
</head>
<body>
<header>
  <a class="brand" href="/">Priyanshu Debnath</a>
  <span class="here">/dump</span>
  <span class="sp"></span>
  <button class="icon" id="theme" title="Switch theme" aria-label="Switch theme">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
  <button id="lock">Unlock</button>
</header>
<div class="wrap">
  <section class="pane">
    <div class="prompt"><b>&#10095;</b><input id="q" placeholder="filter" autocomplete="off" spellcheck="false"><span id="count"></span></div>
    <div id="tree"><div class="note">Loading</div></div>
    <div id="bar">
      <div id="into"></div>
      <button class="pri" id="pick">Upload</button>
      <button id="mk">New folder</button>
      <select id="vis" title="Visibility for new uploads and folders">
        <option value="private">Private</option>
        <option value="public">Public</option>
      </select>
      <input type="file" id="file" multiple hidden>
    </div>
  </section>
  <section class="pane">
    <div class="phead"><div class="ptitle"><div class="ppath" id="ppath"></div><div class="pmeta" id="pmeta"></div></div><div class="acts" id="acts"></div></div>
    <div id="pbody"></div>
  </section>
</div>
<div id="drop">Drop to upload</div>
<div id="ups"></div>
<dialog id="dlg"><form method="dialog"><h3 id="dt"></h3><p id="dm"></p><input id="di" autocomplete="off"><div class="dbtn"><button type="button" id="dno">Cancel</button><button value="ok" class="pri" id="dok">OK</button></div></form></dialog>
<div id="toast"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwm_yKrKMsbZZ4a0T39XJJY2CXq9HRNsGoTCJipW3YrsFWMzWFqOZ11CY0a6D6kGfAPSg/exec';
const CHUNK = 16 * 1024 * 1024;
const $ = (id) => document.getElementById(id);
const N = {};
const S = { sel: null, admin: false, q: '', rows: [], shown: null, tok: null, tokAt: 0, queue: [], busy: false };
let ROOT = null;
const pw = () => { try { return localStorage.getItem('dump_pw') || ''; } catch (e) { return ''; } };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const ICON = {
  dir: '<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg>',
  file: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'
};

async function api(a, o) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ a, pw: pw() }, o || {}))
  });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

function toast(t) {
  $('toast').textContent = t;
  $('toast').classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $('toast').classList.remove('on'), 1800);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function ask(title, o) {
  o = o || {};
  return new Promise((res) => {
    const d = $('dlg');
    $('dt').textContent = title;
    $('dm').textContent = o.msg || '';
    $('dm').hidden = !o.msg;
    $('di').hidden = o.input === false;
    $('di').type = o.type || 'text';
    $('di').value = o.value || '';
    $('dok').textContent = o.ok || 'OK';
    d.returnValue = '';
    d.onclose = () => res(d.returnValue === 'ok' ? (o.input === false ? true : $('di').value.trim()) : null);
    d.showModal();
    if (o.input !== false) { $('di').focus(); $('di').select(); }
  });
}
$('dno').onclick = () => $('dlg').close('no');

function size(n) {
  if (!n) return '';
  const u = ['B', 'K', 'M', 'G', 'T'];
  let i = 0;
  while (n >= 1024 && i < 4) { n /= 1024; i++; }
  return (i ? n.toFixed(n < 10 ? 1 : 0) : n) + u[i];
}

const linkOf = (id) => location.origin + location.pathname + (id && id !== ROOT ? '#' + id : '');
const dlOf = (id) => 'https://drive.google.com/uc?export=download&id=' + id;

function pathOf(id) {
  const p = [];
  let n = N[id];
  while (n && n.id !== ROOT) { p.unshift(n.name); n = N[n.parent]; }
  return p;
}

function ingest(r) {
  S.admin = r.admin;
  const c = r.crumbs;
  if (!ROOT) ROOT = c[0].id;
  c.forEach((x, i) => {
    if (r.file && i === c.length - 1) return;
    if (!N[x.id]) N[x.id] = { id: x.id, name: x.name, folder: true, vis: i ? 'private' : 'public', parent: i ? c[i - 1].id : null, kids: null, open: !i };
  });
  if (r.file) return;
  const self = c[c.length - 1].id;
  N[self].kids = r.items.map((it) => {
    const o = N[it.id] || (N[it.id] = { kids: null, open: false });
    Object.assign(o, it, { parent: self });
    return it.id;
  });
}

async function loadDir(id) {
  ingest(await api('list', id ? { id } : {}));
}

function walk(onlyOpen) {
  const out = [];
  (function rec(id, depth, path) {
    const n = N[id];
    if (!n || !n.kids) return;
    n.kids.forEach((k) => {
      const c = N[k];
      const p = path + c.name + (c.folder ? '/' : '');
      out.push({ n: c, depth, path: p, dir: path });
      if (c.folder && (!onlyOpen || c.open)) rec(k, depth + 1, p);
    });
  })(ROOT, 0, '');
  return out;
}

function renderTree() {
  const T = $('tree');
  const all = walk(false);
  let rows;
  if (S.q) {
    const t = S.q.toLowerCase().split(/\s+/).filter(Boolean);
    rows = all.filter((r) => t.every((x) => r.path.toLowerCase().includes(x)));
  } else {
    rows = walk(true);
  }
  S.rows = rows.map((r) => r.n.id);
  $('count').textContent = rows.length + '/' + all.length;
  T.textContent = '';
  if (!rows.length) {
    T.append(el('div', 'note', S.q ? 'No match' : S.admin ? 'Empty. Drop files here to upload.' : 'Nothing here yet.'));
    return;
  }
  rows.forEach((r) => {
    const n = r.n;
    const row = el('div', 'row' + (n.folder ? ' dir' : '') + (n.open && !S.q ? ' open' : '') + (n.id === S.sel ? ' sel' : ''));
    row.dataset.id = n.id;
    if (!S.q) row.style.paddingLeft = 11 + r.depth * 18 + 'px';
    row.append(el('span', 'caret', n.folder && !S.q ? '▸' : ''));
    row.insertAdjacentHTML('beforeend', n.folder ? ICON.dir : ICON.file);
    const nm = el('span', 'nm');
    if (S.q) { nm.append(el('i', '', r.dir)); nm.append(n.name + (n.folder ? '/' : '')); }
    else nm.textContent = n.name;
    nm.title = r.path;
    row.append(nm);
    if (S.admin && n.vis !== 'public') row.append(el('span', 'lock', 'private'));
    if (!n.folder && n.size) row.append(el('span', 'sz', size(n.size)));
    row.onclick = () => pick(n.id, true);
    T.append(row);
  });
  const s = T.querySelector('.sel');
  if (s) s.scrollIntoView({ block: 'nearest' });
}

function btn(t, fn, cls) {
  const b = el('button', cls || '', t);
  b.onclick = fn;
  return b;
}

function renderPreview() {
  const n = N[S.sel] || N[ROOT];
  if (!n) return;
  const p = pathOf(n.id);
  const P = $('ppath');
  P.textContent = '';
  P.append('dump/' + p.slice(0, -1).map((x) => x + '/').join(''));
  if (p.length) P.append(el('strong', '', p[p.length - 1] + (n.folder ? '/' : '')));
  P.title = 'dump/' + p.join('/');
  const M = $('pmeta');
  M.textContent = '';
  const bits = [];
  if (n.folder) bits.push(n.kids ? n.kids.length + (n.kids.length === 1 ? ' item' : ' items') : 'loading');
  else { if (n.size) bits.push(size(n.size)); if (n.modified) bits.push(new Date(n.modified).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })); }
  M.append(bits.join(' · '));
  if (S.admin && n.id !== ROOT) { M.append(' · '); M.append(el('span', n.vis === 'public' ? 'pub' : '', n.vis)); }
  const A = $('acts');
  A.textContent = '';
  A.append(btn('Copy link', () => copy(n.id)));
  if (!n.folder) { const a = el('a', 'btn', 'Download'); a.href = dlOf(n.id); a.target = '_blank'; a.rel = 'noopener'; A.append(a); }
  if (S.admin && n.id !== ROOT) {
    A.append(btn(n.vis === 'public' ? 'Make private' : 'Make public', () => setVis(n)));
    A.append(btn('Rename', () => rename(n)));
    A.append(btn('Delete', () => trash(n), 'bad'));
  }
  const B = $('pbody');
  const key = n.id + (n.folder ? ':' + (n.kids ? n.kids.map((k) => N[k].name + N[k].vis).join('|') : '') + S.admin : '');
  if (S.shown === key) return;
  S.shown = key;
  B.textContent = '';
  if (!n.folder) {
    const f = el('iframe');
    f.allow = 'autoplay';
    f.allowFullscreen = true;
    f.src = 'https://drive.google.com/file/d/' + n.id + '/preview';
    B.append(f);
    return;
  }
  if (!n.kids) { B.append(el('div', 'note', 'Loading')); return; }
  if (!n.kids.length) { B.append(el('div', 'note', S.admin ? 'Empty folder. Drop files here to upload.' : 'Empty folder.')); return; }
  const L = el('div', 'ls');
  n.kids.forEach((k, i) => {
    const c = N[k];
    L.append(el('span', 't', (i === n.kids.length - 1 ? '└── ' : '├── ')));
    const a = el('a', c.folder ? 'd' : '', c.name + (c.folder ? '/' : ''));
    a.onclick = () => pick(c.id, false);
    L.append(a);
    const m = [];
    if (!c.folder && c.size) m.push(size(c.size));
    if (S.admin && c.vis !== 'public') m.push('private');
    if (m.length) L.append(el('span', 'm', '   ' + m.join(' · ')));
    L.append('\n');
  });
  B.append(L);
}

function render() {
  document.body.classList.toggle('admin', S.admin);
  $('lock').textContent = S.admin ? 'Lock' : 'Unlock';
  const d = N[curDir()];
  $('into').textContent = 'Uploads go to ';
  $('into').append(el('span', '', 'dump/' + (d ? pathOf(d.id).map((x) => x + '/').join('') : '')));
  renderTree();
  renderPreview();
}

function curDir() {
  const n = N[S.sel];
  return n ? (n.folder ? n.id : n.parent) : ROOT;
}

async function pick(id, toggle) {
  const n = N[id];
  if (!n) return;
  const was = S.sel === id;
  S.sel = id;
  history.replaceState(null, '', id === ROOT ? location.pathname : '#' + id);
  if (n.folder) {
    n.open = toggle && was ? !n.open : true;
    let p = N[n.parent];
    while (p) { p.open = true; p = N[p.parent]; }
  }
  render();
  if (n.folder && !n.kids) {
    try { await loadDir(id); } catch (e) { toast(e.message); }
    render();
  }
}

async function reveal(id) {
  const r = await api('list', { id });
  ingest(r);
  const c = r.crumbs;
  await Promise.all(c.slice(1, -1).map((x) => loadDir(x.id)));
  c.forEach((x) => { if (N[x.id] && N[x.id].folder) N[x.id].open = true; });
  S.sel = id;
}

async function init() {
  const id = location.hash.slice(1);
  Object.keys(N).forEach((k) => delete N[k]);
  ROOT = null;
  S.shown = null;
  try {
    await loadDir('');
    S.sel = ROOT;
    if (id && id !== ROOT) {
      try { await reveal(id); }
      catch (e) { toast(e.message === 'Not found' ? 'That item is private or no longer exists' : e.message); history.replaceState(null, '', location.pathname); }
    }
    render();
  } catch (e) {
    $('tree').textContent = '';
    $('tree').append(el('div', 'note', 'Could not load: ' + e.message));
  }
}

async function copy(id) {
  try { await navigator.clipboard.writeText(linkOf(id)); toast('Link copied'); }
  catch (e) { ask('Copy this link', { value: linkOf(id) }); }
}

async function setVis(n) {
  const vis = n.vis === 'public' ? 'private' : 'public';
  try { await api('vis', { id: n.id, vis }); n.vis = vis; render(); toast('Now ' + vis); }
  catch (e) { toast(e.message); }
}

async function rename(n) {
  const name = await ask('Rename', { value: n.name, ok: 'Rename' });
  if (!name || name === n.name) return;
  try { await api('rename', { id: n.id, name }); n.name = name; render(); }
  catch (e) { toast(e.message); }
}

async function trash(n) {
  const ok = await ask('Delete', { msg: 'Move "' + n.name + '" to your Drive trash?', input: false, ok: 'Delete' });
  if (!ok) return;
  try {
    await api('trash', { id: n.id });
    const p = n.parent;
    S.sel = p;
    history.replaceState(null, '', p === ROOT ? location.pathname : '#' + p);
    await loadDir(p === ROOT ? '' : p);
    render();
  } catch (e) { toast(e.message); }
}

async function mkdir() {
  const dir = curDir();
  const name = await ask('New folder', { ok: 'Create' });
  if (!name) return;
  try {
    await api('mkdir', { id: dir, name, vis: $('vis').value });
    await loadDir(dir === ROOT ? '' : dir);
    N[dir].open = true;
    render();
  } catch (e) { toast(e.message); }
}

async function token() {
  if (!S.tok || Date.now() - S.tokAt > 40 * 60 * 1000) {
    S.tok = (await api('token')).token;
    S.tokAt = Date.now();
  }
  return S.tok;
}

function put(url, headers, body, onp) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    Object.keys(headers).forEach((k) => x.setRequestHeader(k, headers[k]));
    if (onp) x.upload.onprogress = (e) => onp(e.loaded);
    x.onload = () => res({ status: x.status, range: x.getResponseHeader('Range'), text: x.responseText });
    x.onerror = () => rej(new Error('Network error'));
    x.send(body);
  });
}

async function upload(file, parent, vis, onp) {
  const t = await token();
  const init = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id', {
    method: 'POST',
    headers: {
      Authorization: 'Bearer ' + t,
      'Content-Type': 'application/json; charset=UTF-8',
      'X-Upload-Content-Type': file.type || 'application/octet-stream',
      'X-Upload-Content-Length': String(file.size)
    },
    body: JSON.stringify({ name: file.name, parents: [parent], description: vis })
  });
  if (!init.ok) throw new Error('Could not start upload (' + init.status + ')');
  const url = init.headers.get('Location');
  if (!url) throw new Error('No upload session returned');
  const total = file.size;
  const next = (r, fallback) => (r.range ? Number(r.range.split('-')[1]) + 1 : fallback);
  let off = 0;
  let fails = 0;
  let done = null;
  if (!total) {
    const r = await put(url, {}, new Blob([]));
    if (r.status >= 300) throw new Error('Upload failed (' + r.status + ')');
    done = JSON.parse(r.text);
  }
  while (!done) {
    const end = Math.min(off + CHUNK, total);
    let r;
    try {
      r = await put(url, { 'Content-Range': 'bytes ' + off + '-' + (end - 1) + '/' + total }, file.slice(off, end), (n) => onp(off + n, total));
    } catch (e) {
      r = { status: 503 };
    }
    if (r.status === 200 || r.status === 201) { done = JSON.parse(r.text); break; }
    if (r.status === 308) { off = next(r, end); fails = 0; onp(off, total); continue; }
    if (r.status >= 500 || r.status === 429) {
      if (++fails > 10) throw new Error('Upload kept failing');
      await sleep(Math.min(30000, 1500 * fails));
      try {
        const p = await put(url, { 'Content-Range': 'bytes */' + total }, new Blob([]));
        if (p.status === 200 || p.status === 201) { done = JSON.parse(p.text); break; }
        if (p.status === 308) off = next(p, 0);
      } catch (e) {}
      continue;
    }
    throw new Error('Upload failed (' + r.status + ')');
  }
  onp(total, total);
  if (vis === 'public') await api('vis', { id: done.id, vis });
  return done.id;
}

function enqueue(files) {
  if (!S.admin) { toast('Unlock first'); return; }
  const parent = curDir();
  const vis = $('vis').value;
  Array.from(files).forEach((file) => {
    const box = el('div', 'up');
    const st = el('small', '', 'Waiting · ' + vis);
    const track = el('div', 'track');
    const fill = el('div', 'fill');
    track.append(fill);
    box.append(el('div', '', file.name), st, track);
    $('ups').append(box);
    S.queue.push({ file, parent, vis, box, st, fill });
  });
  pump();
}

async function pump() {
  if (S.busy) return;
  S.busy = true;
  while (S.queue.length) {
    const j = S.queue.shift();
    try {
      await upload(j.file, j.parent, j.vis, (n, t) => {
        j.fill.style.width = (t ? (n / t) * 100 : 100) + '%';
        j.st.textContent = size(n) + ' of ' + size(t) + ' · ' + j.vis;
      });
      j.st.textContent = 'Done · ' + j.vis;
      setTimeout(() => j.box.remove(), 3500);
      try { await loadDir(j.parent === ROOT ? '' : j.parent); N[j.parent].open = true; render(); } catch (e) {}
    } catch (e) {
      j.box.classList.add('err');
      j.st.textContent = e.message;
      j.box.append(btn('Dismiss', () => j.box.remove()));
    }
  }
  S.busy = false;
}

$('lock').onclick = async () => {
  if (S.admin) { try { localStorage.removeItem('dump_pw'); } catch (e) {} S.tok = null; await init(); return; }
  const p = await ask('Unlock', { type: 'password', ok: 'Unlock' });
  if (!p) return;
  try { localStorage.setItem('dump_pw', p); } catch (e) {}
  await init();
  if (!S.admin) { try { localStorage.removeItem('dump_pw'); } catch (e) {} toast('Wrong password'); }
};
$('theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('pref-theme', t); } catch (e) {}
};
$('pick').onclick = () => $('file').click();
$('file').onchange = (e) => { enqueue(e.target.files); e.target.value = ''; };
$('mk').onclick = mkdir;
$('q').oninput = (e) => { S.q = e.target.value.trim(); renderTree(); };
document.addEventListener('keydown', (e) => {
  if ($('dlg').open) return;
  const inQ = document.activeElement === $('q');
  if (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && !inQ) return;
  if (e.key === '/' && !inQ) { e.preventDefault(); $('q').focus(); return; }
  if (e.key === 'Escape' && inQ) { $('q').value = ''; S.q = ''; $('q').blur(); renderTree(); return; }
  const i = S.rows.indexOf(S.sel);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!S.rows.length) return;
    e.preventDefault();
    const j = e.key === 'ArrowDown' ? Math.min(S.rows.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1);
    pick(S.rows[j], false);
  } else if (e.key === 'ArrowLeft' && !inQ && N[S.sel] && S.sel !== ROOT) {
    const n = N[S.sel];
    if (n.folder && n.open) { n.open = false; render(); } else pick(n.parent, false);
  }
});
let depth = 0;
const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
window.addEventListener('dragenter', (e) => { if (hasFiles(e) && S.admin) { depth++; $('drop').classList.add('on'); } });
window.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; $('drop').classList.remove('on'); } });
window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  depth = 0;
  $('drop').classList.remove('on');
  enqueue(e.dataTransfer.files);
});
window.addEventListener('beforeunload', (e) => { if (S.busy) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('hashchange', init);
init();
</script>
