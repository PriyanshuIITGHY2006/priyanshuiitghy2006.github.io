<style>
:root{--theme:#f6f3ec;--primary:#25221e;--secondary:#6e685e;--tertiary:#e3ddd0;--content:#2b2824;--code-bg:#ece7dc;--border:#e3ddd0;--accent:#9a3412;--bad:#b91c1c;--radius:8px;--gap:24px;color-scheme:light;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Open Sans","Helvetica Neue",sans-serif}
:root[data-theme="dark"]{--theme:#1b1816;--primary:#ece6df;--secondary:#a39a90;--tertiary:#3a342f;--content:#d9d2ca;--code-bg:#2a2522;--border:#2e2925;--accent:#e0a458;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--theme);color:var(--content);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.header-nav{display:flex;flex-wrap:wrap;justify-content:space-between;max-width:1248px;width:100%;margin:0 auto;line-height:60px;padding:0 var(--gap);column-gap:var(--gap)}
.logo{display:flex;align-items:center;column-gap:.55rem}
.logo a{display:flex;align-items:center;color:var(--primary)}
.logo-mark{height:26px;width:auto;display:block}
#theme{display:inline-flex;align-items:center;padding:0 .4rem;color:var(--primary)}
:root[data-theme="dark"] .moon,:root:not([data-theme="dark"]) .sun{display:none}
.menu{display:flex;list-style:none;margin:0;padding:0;column-gap:var(--gap);overflow-x:auto;white-space:nowrap}
.menu a{font-size:16px;color:var(--primary)}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1248px;width:100%;margin:0 auto;padding:20px var(--gap) var(--gap)}
.side{min-height:0;display:flex;flex-direction:column;padding-right:28px}
.find{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--primary);font:inherit;font-size:15px;padding:4px 0}
#q::placeholder{color:var(--secondary)}
#tree{flex:1;min-height:0;overflow:auto;margin-right:-12px;padding-right:12px;scrollbar-width:thin;scrollbar-color:var(--tertiary) transparent}
.row{display:flex;align-items:baseline;gap:6px;padding:4px 0;font-size:15px;line-height:1.4;color:var(--content);cursor:pointer}
.row:hover .nm{color:var(--accent);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.row.sel .nm{color:var(--accent);font-weight:600}
.row.dir .nm{color:var(--primary);font-weight:600}
.row.dir.sel .nm{color:var(--accent)}
.chev{flex:0 0 12px;width:12px;align-self:center;height:12px;color:var(--secondary)}
.chev svg{display:block;width:12px;height:12px;transition:transform .12s}
.row.open .chev svg{transform:rotate(90deg)}
.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm i{font-style:normal;font-weight:400;color:var(--secondary)}
body.admin .row.pub::after{content:"";flex:0 0 6px;width:6px;height:6px;border-radius:50%;background:var(--accent);align-self:center;margin-left:2px}
.row.drop .nm{color:var(--accent);text-decoration:underline;text-underline-offset:4px}
.quiet{color:var(--secondary);font-size:15px;padding:6px 0}
.foot{padding-top:12px;font-size:14px}
.lnk{font-size:14px;color:var(--secondary)}
.lnk:hover{color:var(--accent);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.lnk.bad:hover{color:var(--bad)}
.main{min-height:0;min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--border);padding-left:36px}
#pname{margin:0;font-size:28px;line-height:1.25;font-weight:700;color:var(--primary);overflow-wrap:anywhere}
#pmeta{margin-top:4px;font-size:14px;color:var(--secondary);min-height:22px}
#acts{display:flex;flex-wrap:wrap;align-items:center;gap:4px 20px;margin-top:8px;min-height:24px}
#pbody{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:18px}
#pbody iframe{flex:1;width:100%;min-height:320px;border:1px solid var(--border);border-radius:var(--radius);background:var(--code-bg)}
.pop{position:relative}
.pop summary{list-style:none;cursor:pointer;font-size:14px;color:var(--secondary)}
.pop summary::-webkit-details-marker{display:none}
.pop summary:hover{color:var(--accent);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
#add summary{color:var(--accent);font-weight:600}
.pmenu{position:absolute;z-index:15;top:calc(100% + 6px);left:0;min-width:200px;padding:6px;background:var(--theme);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.16)}
#add .pmenu{left:auto;right:0}

.pmenu button:hover{background:var(--code-bg)}
.pmenu button.bad:hover{color:var(--bad)}
.pmenu hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
.pmenu button.sub{color:var(--secondary)}
#drop{position:fixed;inset:14px;display:none;align-items:center;justify-content:center;border:2px dashed var(--accent);border-radius:var(--radius);background:color-mix(in srgb,var(--theme) 88%,var(--accent));font:600 18px var(--sans);color:var(--primary);z-index:30;pointer-events:none;text-align:center;padding:20px}
#drop.on{display:flex}
#ups{position:fixed;right:20px;bottom:20px;width:min(330px,calc(100vw - 40px));display:flex;flex-direction:column;gap:8px;z-index:20}
.up,.ul{background:var(--theme);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.16)}
.up{padding:12px 14px}
.uh{font-size:14.5px;font-weight:600;color:var(--primary)}
.up small{display:block;color:var(--secondary);font-size:13px}
.up small.e{color:var(--bad)}
.track{height:3px;margin-top:9px;border-radius:2px;background:var(--code-bg);overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .2s}
.ub{display:flex;gap:18px;margin-top:9px}
.ul{padding:6px 0;max-height:190px;overflow:auto}
.ur{display:flex;gap:10px;align-items:baseline;padding:3px 14px;font-size:13px}
.ur span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ur small{flex:0 0 auto;max-width:55%;text-align:right;color:var(--secondary)}

dialog{border:1px solid var(--border);border-radius:var(--radius);background:var(--theme);color:var(--content);padding:22px;width:min(380px,calc(100vw - 32px));box-shadow:0 14px 44px rgba(0,0,0,.3)}

}

<script>
const API = 'https://script.google.com/macros/s/AKfycbwm_yKrKMsbZZ4a0T39XJJY2CXq9HRNsGoTCJipW3YrsFWMzWFqOZ11CY0a6D6kGfAPSg/exec';
const CHUNK = 16 * 1024 * 1024;
const $ = (id) => document.getElementById(id);
const N = {};
const S = { sel: null, admin: false, q: '', rows: [], shown: null, tok: null, tokAt: 0, vis: 'private' };
let ROOT = null;
const pw = () => { try { return localStorage.getItem('dump_pw') || ''; } catch (e) { return ''; } };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const CHEV = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5 8 6l-3.5 3.5"/></svg>';

async function api(a, o) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ a, pw: pw() }, o || {}))
  });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

function toast(t) {
  $('toast').textContent = t;
  $('toast').classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $('toast').classList.remove('on'), 1800);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function ask(title, o) {
  o = o || {};
  return new Promise((res) => {
    const d = $('dlg');
    $('dt').textContent = title;
    $('dm').textContent = o.msg || '';
    $('dm').hidden = !o.msg;
    $('di').hidden = o.input === false;
    $('di').type = o.type || 'text';
    $('di').value = o.value || '';
    $('dok').textContent = o.ok || 'OK';
    d.returnValue = '';
    d.onclose = () => res(d.returnValue === 'ok' ? (o.input === false ? true : $('di').value.trim()) : null);
    d.showModal();
    if (o.input !== false) { $('di').focus(); $('di').select(); }
  });
}
$('dno').onclick = () => $('dlg').close('no');

function size(n) {
  if (!n) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < 4) { n /= 1024; i++; }
  return (i ? n.toFixed(n < 10 ? 1 : 0) : n) + ' ' + u[i];
}

const linkOf = (id) => location.origin + location.pathname + (id && id !== ROOT ? '#' + id : '');
const dlOf = (id) => 'https://drive.google.com/uc?export=download&id=' + id;

function pathOf(id) {
  const p = [];
  let n = N[id];
  while (n && n.id !== ROOT) { p.unshift(n.name); n = N[n.parent]; }
  return p;
}

function ingest(r) {
  S.admin = r.admin;
  const c = r.crumbs;
  if (!ROOT) ROOT = c[0].id;
  c.forEach((x, i) => {
    if (r.file && i === c.length - 1) return;
    if (!N[x.id]) N[x.id] = { id: x.id, name: x.name, folder: true, vis: i ? 'private' : 'public', parent: i ? c[i - 1].id : null, kids: null, open: !i };
  });
  if (r.file) return;
  const self = c[c.length - 1].id;
  N[self].kids = r.items.map((it) => {
    const o = N[it.id] || (N[it.id] = { kids: null, open: false });
    Object.assign(o, it, { parent: self });
    return it.id;
  });
}

async function loadDir(id) {
  ingest(await api('list', id ? { id } : {}));
}

function walk(onlyOpen) {
  const out = [];
  (function rec(id, depth, path) {
    const n = N[id];
    if (!n || !n.kids) return;
    n.kids.forEach((k) => {
      const c = N[k];
      const p = path + c.name + (c.folder ? '/' : '');
      out.push({ n: c, depth, path: p, dir: path });
      if (c.folder && (!onlyOpen || c.open)) rec(k, depth + 1, p);
    });
  })(ROOT, 0, '');
  return out;
}

function renderTree() {
  const T = $('tree');
  let rows;
  if (S.q) {
    const t = S.q.toLowerCase().split(/\s+/).filter(Boolean);
    rows = walk(false).filter((r) => t.every((x) => r.path.toLowerCase().includes(x)));
  } else {
    rows = walk(true);
  }
  S.rows = rows.map((r) => r.n.id);
  T.textContent = '';
  if (!rows.length) {
    T.append(el('div', 'quiet', S.q ? 'No match.' : S.admin ? 'Nothing here yet. Drop files anywhere to add them.' : 'Nothing here yet.'));
    return;
  }
  rows.forEach((r) => {
    const n = r.n;
    const row = el('div', 'row' + (n.folder ? ' dir' : '') + (n.open && !S.q ? ' open' : '') + (n.id === S.sel ? ' sel' : '') + (n.vis === 'public' ? ' pub' : ''));
    row.dataset.id = n.id;
    if (!S.q) row.style.paddingLeft = r.depth * 18 + 'px';
    const c = el('span', 'chev');
    if (n.folder && !S.q) c.innerHTML = CHEV;
    row.append(c);
    const nm = el('span', 'nm');
    if (S.q) { nm.append(el('i', '', r.dir)); nm.append(n.name); }
    else nm.textContent = n.name;
    row.title = r.path + (S.admin ? (n.vis === 'public' ? ' (public)' : ' (private)') : '');
    row.append(nm);
    row.onclick = () => pick(n.id, true);
    T.append(row);
  });
  const s = T.querySelector('.sel');
  if (s) s.scrollIntoView({ block: 'nearest' });
}

function btn(t, fn, cls) {
  const b = el('button', cls || 'lnk', t);
  b.onclick = fn;
  return b;
}

function renderPreview() {
  const n = N[S.sel] || N[ROOT];
  if (!n) return;
  $('pname').textContent = n.id === ROOT ? 'Dump' : n.name;
  const bits = [];
  if (n.folder) { if (n.kids) bits.push(n.kids.length === 1 ? '1 item' : n.kids.length + ' items'); }
  else {
    if (n.size) bits.push(size(n.size));
    if (n.modified) bits.push(new Date(n.modified).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }));
  }
  if (S.admin && n.id !== ROOT) bits.push(n.vis === 'public' ? 'public' : 'private');
  $('pmeta').textContent = bits.join(', ');
  const A = $('acts');
  A.textContent = '';
  if (n.id !== ROOT) A.append(btn('Copy link', () => copy(n.id)));
  if (!n.folder) { const a = el('a', 'lnk', 'Download'); a.href = dlOf(n.id); a.target = '_blank'; a.rel = 'noopener'; A.append(a); }
  if (S.admin && n.id !== ROOT) {
    A.append(btn(n.vis === 'public' ? 'Make private' : 'Make public', () => setVis(n)));
    const d = el('details', 'pop');
    d.append(el('summary', '', 'More'));

    m.append(btn('Rename', () => { d.open = false; rename(n); }, ''), btn('Delete', () => { d.open = false; trash(n); }, 'bad'));
    d.append(m);

  }
  const B = $('pbody');

}

function render() {
  document.body.classList.toggle('admin', S.admin);
  $('lock').textContent = S.admin ? 'Lock' : 'Unlock';
  $('add').hidden = !S.admin;

function curDir() {
  const n = N[S.sel];
  return n ? (n.folder ? n.id : n.parent) : ROOT;
}

async function pick(id, toggle) {
  const n = N[id];
  if (!n) return;
  const was = S.sel === id;
  S.sel = id;
  history.replaceState(null, '', id === ROOT ? location.pathname : '#' + id);
  if (n.folder) {
    n.open = toggle && was ? !n.open : true;
    let p = N[n.parent];
    while (p) { p.open = true; p = N[p.parent]; }
  }
  render();
  if (n.folder && !n.kids) {
    try { await loadDir(id); } catch (e) { toast(e.message); }
    render();
  }
}

async function reveal(id) {
  const r = await api('list', { id });
  ingest(r);
  const c = r.crumbs;
  await Promise.all(c.slice(1, -1).map((x) => loadDir(x.id)));
  c.forEach((x) => { if (N[x.id] && N[x.id].folder) N[x.id].open = true; });
  S.sel = id;
}

async function init() {
  const id = location.hash.slice(1);
  Object.keys(N).forEach((k) => delete N[k]);
  ROOT = null;
  S.shown = null;
  try {
    await loadDir('');
    S.sel = ROOT;
    if (id && id !== ROOT) {
      try { await reveal(id); }
      catch (e) { toast(e.message === 'Not found' ? 'That item is private or no longer exists' : e.message); history.replaceState(null, '', location.pathname); }
    }
    render();
  } catch (e) {
    $('tree').textContent = '';
    $('tree').append(el('div', 'quiet', 'Could not load. ' + e.message));

}

async function copy(id) {

async function setVis(n) {

async function rename(n) {

  if (!name || name === n.name) return;

  catch (e) { toast(e.message); }

async function trash(n) {

  if (!ok) return;
  try {
    await api('trash', { id: n.id });
    const p = n.parent;
    S.sel = p;
    history.replaceState(null, '', p === ROOT ? location.pathname : '#' + p);

async function mkdir() {
  const dir = curDir();
  const name = await ask('New folder', { ok: 'Create' });
  if (!name) return;

    await api('mkdir', { id: dir, name, vis: S.vis });

    render();
  } catch (e) { toast(e.message); }
}

const U = { jobs: [], active: 0, names: {}, raf: 0, auto: 0, rt: 0 };
const JUNK = /^(\.DS_Store|Thumbs\.db|desktop\.ini|\._.*)$/i;
const UPLOAD_URL = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id';
const pending = () => U.jobs.some((j) => j.state === 'wait' || j.state === 'run');

async function token(force) {
  if (force || !S.tok || Date.now() - S.tokAt > 40 * 60 * 1000) {
    S.tok = (await api('token')).token;
    S.tokAt = Date.now();
  }
  return S.tok;
}

function put(j, url, headers, body, onp) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    j.xhr = x;
    x.open('PUT', url);
    Object.keys(headers).forEach((k) => x.setRequestHeader(k, headers[k]));
    if (onp) x.upload.onprogress = (e) => onp(e.loaded);
    x.onload = () => res({ status: x.status, range: x.getResponseHeader('Range'), text: x.responseText });
    x.onerror = () => rej(new Error('Network error'));
    x.onabort = () => rej(new Error('Cancelled'));
    x.send(body);
  });
}

async function gerr(r, fallback) {
  try { const t = await r.json(); return (t.error && t.error.message) || fallback; }
  catch (e) { return fallback; }
}

async function startSession(j, pid) {
  for (let a = 0; a < 2; a++) {
    const t = await token(a > 0);
    const h = { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json; charset=UTF-8', 'X-Upload-Content-Length': String(j.file.size) };
    if (j.file.type) h['X-Upload-Content-Type'] = j.file.type;
    const r = await fetch(UPLOAD_URL, { method: 'POST', headers: h, body: JSON.stringify({ name: j.name, parents: [pid], description: j.vis }) });
    if (r.status === 401 && !a) continue;
    if (!r.ok) throw new Error(await gerr(r, 'Could not start upload (' + r.status + ')'));
    const u = r.headers.get('Location');
    if (!u) throw new Error('No upload session returned');
    return u;
  }
}

async function makePublic(id) {
  try {
    const r = await fetch('https://www.googleapis.com/drive/v3/files/' + id + '/permissions', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + (await token()), 'Content-Type': 'application/json' },
      body: JSON.stringify({ role: 'reader', type: 'anyone' })
    });
    if (r.ok) return;
  } catch (e) {}
  await api('vis', { id, vis: 'public' });
}

async function upload(j, pid) {
  const file = j.file;
  const total = file.size;
  const next = (r, fallback) => (r.range ? Number(r.range.split('-')[1]) + 1 : fallback);
  const stop = () => { if (j.state === 'cancel') throw new Error('Cancelled'); };
  let off = 0;
  let fails = 0;
  let done = null;
  const probe = async () => {
    const p = await put(j, j.url, { 'Content-Range': 'bytes */' + total }, new Blob([]));
    if (p.status === 200 || p.status === 201) done = JSON.parse(p.text);
    else if (p.status === 308) off = next(p, 0);
    else if (p.status === 404 || p.status === 410) j.url = null;
  };
  if (j.url && total) { try { await probe(); } catch (e) { stop(); } }
  if (!j.url) { j.url = await startSession(j, pid); off = 0; }
  stop();
  if (!total && !done) {
    const r = await put(j, j.url, {}, new Blob([]));
    if (r.status >= 300) throw new Error('Upload failed (' + r.status + ')');
    done = JSON.parse(r.text);
  }
  while (!done) {
    stop();
    const end = Math.min(off + CHUNK, total);
    let r;
    try {
      r = await put(j, j.url, { 'Content-Range': 'bytes ' + off + '-' + (end - 1) + '/' + total }, file.slice(off, end), (n) => { j.sent = off + n; draw(); });
    } catch (e) {
      stop();
      r = { status: 503 };
    }
    if (r.status === 200 || r.status === 201) { done = JSON.parse(r.text); break; }
    if (r.status === 308) { off = next(r, end); fails = 0; j.sent = off; draw(); continue; }
    if (r.status >= 500 || r.status === 429) {
      if (++fails > 10) throw new Error(navigator.onLine === false ? 'You are offline' : 'Upload kept failing');
      await sleep(Math.min(30000, 1500 * fails));
      stop();
      try { await probe(); } catch (e) { stop(); }
      if (!j.url) throw new Error('Upload session expired');
      continue;
    }
    j.url = null;
    throw new Error(r.status === 403 ? 'Drive refused the upload (storage or rate limit)' : 'Upload failed (' + r.status + ')');
  }
  j.sent = total;
  if (j.vis === 'public') await makePublic(done.id);
  return done.id;
}

function kidsReady(id) {
  return N[id].kids ? Promise.resolve() : loadDir(id === ROOT ? '' : id);
}

function sortKids(pid) {
  N[pid].kids.sort((a, b) => (N[b].folder ? 1 : 0) - (N[a].folder ? 1 : 0) || N[a].name.localeCompare(N[b].name, undefined, { numeric: true, sensitivity: 'base' }));
}

function ensureDir(target, path, vis, memo) {
  if (!path.length) return kidsReady(target).then(() => target);
  const key = path.join('/');
  if (!memo[key]) {
    memo[key] = ensureDir(target, path.slice(0, -1), vis, memo).then(async (pid) => {
      const name = path[path.length - 1];
      const ex = N[pid].kids.map((k) => N[k]).find((c) => c.folder && c.name === name);
      N[pid].open = true;
      if (ex) { await kidsReady(ex.id); ex.open = true; return ex.id; }
      const r = await api('mkdir', { id: pid, name, vis });
      N[r.id] = { id: r.id, name, folder: true, vis, parent: pid, kids: [], open: false, size: 0, modified: new Date().toISOString() };
      N[pid].kids.push(r.id);
      sortKids(pid);
      return r.id;
    }).catch((e) => { delete memo[key]; throw e; });
  }
  return memo[key];
}

function uniq(name, pid) {
  const used = new Set(N[pid].kids.map((k) => N[k].name));
  (U.names[pid] || []).forEach((x) => used.add(x));
  let out = name;
  if (used.has(out)) {
    const d = name.lastIndexOf('.');
    const b = d > 0 ? name.slice(0, d) : name;
    const x = d > 0 ? name.slice(d) : '';
    let i = 1;
    do { out = b + ' (' + i++ + ')' + x; } while (used.has(out));
  }
  (U.names[pid] || (U.names[pid] = new Set())).add(out);
  return out;
}

function softRender() {
  if (U.rt) return;
  U.rt = setTimeout(() => { U.rt = 0; render(); }, 350);
}

async function run(j) {
  j.state = 'run';
  j.err = null;
  U.active++;
  draw();
  try {
    const pid = await ensureDir(j.target, j.path, j.vis, j.memo);
    if (j.state === 'cancel') throw new Error('Cancelled');
    if (!j.name) j.name = uniq(j.file.name, pid);
    const id = await upload(j, pid);
    N[id] = { id, name: j.name, folder: false, mime: j.file.type, size: j.file.size, modified: new Date().toISOString(), vis: j.vis, parent: pid, kids: null, open: false };
    N[pid].kids.push(id);
    sortKids(pid);
    j.state = 'done';
  } catch (e) {
    if (j.state !== 'cancel') { j.state = 'err'; j.err = (e && e.message) || String(e); }
  }
  j.xhr = null;
  U.active--;
  U.jobs = U.jobs.filter((x) => x.state !== 'cancel');
  draw();
  softRender();
  pump();
}

function pump() {
  while (U.active < 3) {
    const j = U.jobs.find((x) => x.state === 'wait');
    if (!j) break;
    run(j);
  }
  if (!pending() && U.jobs.length && !U.jobs.some((j) => j.state === 'err')) {
    clearTimeout(U.auto);
    U.auto = setTimeout(() => { if (!pending()) clearJobs(); }, 4000);
  }
}

function clearJobs() {
  U.jobs = [];
  U.names = {};
  draw();
}

function cancelAll() {
  U.jobs.forEach((j) => {
    if (j.state === 'run') { j.state = 'cancel'; if (j.xhr) j.xhr.abort(); }
  });
  U.jobs = U.jobs.filter((j) => j.state !== 'wait');
  draw();
}

function retryFailed() {
  U.jobs.forEach((j) => { if (j.state === 'err') { j.state = 'wait'; j.err = null; } });
  draw();
  pump();
}

function draw() {
  if (U.raf) return;
  U.raf = requestAnimationFrame(() => {
    U.raf = 0;
    const P = $('ups');
    P.textContent = '';
    if (!U.jobs.length) return;
    const total = U.jobs.length;
    const done = U.jobs.filter((j) => j.state === 'done').length;
    const errs = U.jobs.filter((j) => j.state === 'err');
    const busy = pending();
    const bytes = U.jobs.reduce((a, j) => a + j.file.size, 0);
    const sent = U.jobs.reduce((a, j) => a + (j.state === 'done' ? j.file.size : j.sent || 0), 0);
    const box = el('div', 'up');
    box.append(el('div', 'uh', busy ? 'Uploading ' + done + ' of ' + total : done + ' of ' + total + ' uploaded'));
    const sub = [];
    if (bytes) sub.push(size(sent) + ' of ' + size(bytes));
    if (errs.length) sub.push(errs.length + ' failed');
    box.append(el('small', errs.length ? 'e' : '', sub.join(', ')));
    const track = el('div', 'track');
    const fill = el('div', 'fill');
    fill.style.width = (bytes ? (sent / bytes) * 100 : total ? (done / total) * 100 : 0) + '%';
    track.append(fill);
    box.append(track);
    const bs = el('div', 'ub');
    if (busy) bs.append(btn('Cancel', cancelAll));
    if (!busy && errs.length) bs.append(btn('Retry failed', retryFailed));
    if (!busy) bs.append(btn('Dismiss', clearJobs));
    box.append(bs);
    P.append(box);
    const list = el('div', 'ul');
    const show = U.jobs.filter((j) => j.state === 'run').concat(errs);
    show.slice(0, 6).forEach((j) => {
      const r = el('div', 'ur' + (j.state === 'err' ? ' err' : ''));
      r.append(el('span', '', (j.path.length ? j.path.join('/') + '/' : '') + (j.name || j.file.name)));
      r.append(el('small', '', j.state === 'err' ? j.err : j.file.size ? Math.floor(((j.sent || 0) / j.file.size) * 100) + '%' : ''));
      list.append(r);
    });
    if (show.length > 6) list.append(el('div', 'ur', '+ ' + (show.length - 6) + ' more'));
    if (show.length) P.append(list);
  });
}

function addFiles(list, dirs, target) {
  if (!S.admin) { toast('Unlock first'); return; }
  if (!N[target] || !N[target].folder) target = ROOT;
  const vis = S.vis;
  const memo = {};
  let skipped = 0;
  let added = 0;
  list.forEach((x) => {
    if (JUNK.test(x.file.name)) { skipped++; return; }
    U.jobs.push({ file: x.file, path: x.path, target, vis, memo, sent: 0, state: 'wait', url: null, name: null });
    added++;
  });
  let chain = Promise.resolve();
  (dirs || []).forEach((p) => { chain = chain.then(() => ensureDir(target, p, vis, memo)).then(softRender, () => {}); });
  if (!added && !(dirs || []).length) { toast(skipped ? 'Only system files, nothing uploaded' : 'Nothing to upload'); return; }
  if (skipped) toast('Skipped ' + skipped + ' system file' + (skipped > 1 ? 's' : ''));
  N[target].open = true;
  clearTimeout(U.auto);
  draw();
  pump();
}

function readAll(reader) {
  return new Promise((res) => {
    const out = [];
    (function more() {
      reader.readEntries((b) => { if (!b.length) res(out); else { out.push.apply(out, b); more(); } }, () => res(out));
    })();
  });
}

async function crawl(entry, path, files, dirs) {
  if (entry.isFile) {
    try { files.push({ file: await new Promise((res, rej) => entry.file(res, rej)), path }); } catch (e) {}
    return;
  }
  if (!entry.isDirectory) return;
  const here = path.concat(entry.name);
  dirs.push(here);
  const kids = await readAll(entry.createReader());
  for (const k of kids) await crawl(k, here, files, dirs);
}

async function fromDrop(dt, target) {
  const entries = [];
  const files = [];
  const items = dt.items ? Array.from(dt.items) : [];
  items.forEach((it) => {
    if (it.kind !== 'file') return;
    const en = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
    if (en) entries.push(en);
    else { const f = it.getAsFile(); if (f) files.push({ file: f, path: [] }); }
  });
  if (!items.length) Array.from(dt.files || []).forEach((f) => files.push({ file: f, path: [] }));
  const dirs = [];
  if (entries.some((e) => e.isDirectory)) toast('Reading folder');
  for (const en of entries) await crawl(en, [], files, dirs);
  addFiles(files, dirs, target);
}

function rowDir(e) {
  const row = e.target && e.target.closest ? e.target.closest('.row') : null;
  const n = row ? N[row.dataset.id] : null;
  return { row, dir: n ? (n.folder ? n.id : n.parent) : curDir() };
}

$('lock').onclick = async () => {
  if (S.admin) {
    if (pending()) { toast('Wait for uploads to finish or cancel them'); return; }
    try { localStorage.removeItem('dump_pw'); } catch (e) {}
    S.tok = null;
    clearJobs();
    await init();
    return;
  }
  const p = await ask('Unlock', { type: 'password', ok: 'Unlock' });
  if (!p) return;
  try { localStorage.setItem('dump_pw', p); } catch (e) {}

  if (!S.admin) { try { localStorage.removeItem('dump_pw'); } catch (e) {} toast('Wrong password'); }
};

$('pick').onclick = () => { $('add').open = false; $('file').click(); };
$('file').onchange = (e) => { addFiles(Array.from(e.target.files).map((f) => ({ file: f, path: [] })), [], curDir()); e.target.value = ''; };
if ('webkitdirectory' in $('dir')) $('pickd').onclick = () => { $('add').open = false; $('dir').click(); };
else $('pickd').hidden = true;
$('dir').onchange = (e) => {

};
$('mk').onclick = () => { $('add').open = false; mkdir(); };
$('visb').onclick = () => { S.vis = S.vis === 'public' ? 'private' : 'public'; $('visb').textContent = 'New items are ' + S.vis; };
document.addEventListener('click', (e) => { document.querySelectorAll('details.pop[open]').forEach((d) => { if (!d.contains(e.target)) d.open = false; }); });
$('q').oninput = (e) => { S.q = e.target.value.trim(); renderTree(); };
document.addEventListener('paste', (e) => {
  if (!S.admin || $('dlg').open) return;
  const fs = e.clipboardData ? Array.from(e.clipboardData.files || []) : [];
  if (!fs.length) return;
  e.preventDefault();
  addFiles(fs.map((f) => ({ file: f, path: [] })), [], curDir());
});
document.addEventListener('keydown', (e) => {
  if ($('dlg').open) return;
  const inQ = document.activeElement === $('q');
  if (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && !inQ) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/' && !inQ) { e.preventDefault(); $('q').focus(); return; }
  if (e.key === 'Escape' && inQ) { $('q').value = ''; S.q = ''; $('q').blur(); renderTree(); return; }
  const i = S.rows.indexOf(S.sel);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!S.rows.length) return;
    e.preventDefault();
    const j = e.key === 'ArrowDown' ? Math.min(S.rows.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1);
    pick(S.rows[j], false);
  } else if (e.key === 'ArrowLeft' && !inQ && N[S.sel] && S.sel !== ROOT) {
    const n = N[S.sel];
    if (n.folder && n.open) { n.open = false; render(); } else pick(n.parent, false);
  }
});
let depth = 0;
let hot = null;
const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
const cool = () => { if (hot) hot.classList.remove('drop'); hot = null; };
window.addEventListener('dragenter', (e) => { if (hasFiles(e) && S.admin) { depth++; $('drop').classList.add('on'); } });
window.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; $('drop').classList.remove('on'); cool(); } });
window.addEventListener('dragover', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  if (!S.admin) return;
  const t = rowDir(e);
  if (t.row !== hot) { cool(); hot = t.row; if (hot) hot.classList.add('drop'); }
  $('drop').textContent = 'Drop to upload to dump/' + pathOf(t.dir).map((x) => x + '/').join('');
});
window.addEventListener('drop', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  depth = 0;
  $('drop').classList.remove('on');
  const t = rowDir(e);
  cool();
  if (!S.admin) { toast('Unlock first'); return; }
  fromDrop(e.dataTransfer, t.dir);
});
window.addEventListener('beforeunload', (e) => { if (pending()) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1) || ROOT;
  if (N[id]) pick(id, false);
  else if (pending()) toast('Finish or cancel uploads first');
  else init();
});
init();
</script>
