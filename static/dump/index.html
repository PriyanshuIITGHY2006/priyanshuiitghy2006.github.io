<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>dump | Priyanshu Debnath</title>
<link rel="icon" href="/favicon.ico">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('pref-theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
:root{--theme:#f6f3ec;--entry:#f6f3ec;--primary:#25221e;--secondary:#6e685e;--tertiary:#e3ddd0;--content:#2b2824;--code-bg:#ece7dc;--border:#e3ddd0;--accent:#9a3412;--radius:8px;--ok:#3f6212;--bad:#b91c1c;color-scheme:light;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Open Sans","Helvetica Neue",sans-serif;
--mono:ui-monospace,"JetBrains Mono","Cascadia Code","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
:root[data-theme="dark"]{--theme:#1b1816;--entry:#1b1816;--primary:#ece6df;--secondary:#a39a90;--tertiary:#3a342f;--content:#d9d2ca;--code-bg:#2a2522;--border:#2e2925;--accent:#e0a458;--ok:#a3e635;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--theme);color:var(--content);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
header{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:60px;padding:0 24px;max-width:1500px;width:100%;margin:0 auto}
.brand{font-size:22px;font-weight:700;color:var(--primary);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.here{font:14px var(--mono);color:var(--accent)}
.sp{flex:1}
button,select,.btn{font:13px var(--sans);color:var(--primary);background:transparent;border:1px solid var(--border);border-radius:6px;padding:5px 11px;cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.4}
button:hover,.btn:hover,select:hover{border-color:var(--secondary)}
button.pri{background:var(--primary);border-color:var(--primary);color:var(--theme)}
button.pri:hover{opacity:.88}
button.bad:hover{color:var(--bad);border-color:var(--bad)}
select{background:var(--theme)}
.icon{display:inline-flex;padding:6px;border:0}
.icon svg{width:18px;height:18px}
:root[data-theme="dark"] .moon,:root:not([data-theme="dark"]) .sun{display:none}
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,36%) 1fr;gap:16px;padding:0 24px 24px;max-width:1500px;width:100%;margin:0 auto}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);background:var(--entry);overflow:hidden}
.prompt{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);font:14px var(--mono)}
.prompt b{color:var(--accent);font-weight:700}
.prompt input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--primary);font:inherit}
.prompt input::placeholder{color:var(--secondary);opacity:.7}
#count{color:var(--secondary);font-size:12px}
#tree{flex:1;overflow:auto;padding:6px 0;font:13.5px/1.2 var(--mono)}
.row{display:flex;align-items:center;gap:7px;padding:5px 14px 5px 11px;border-left:3px solid transparent;cursor:pointer;color:var(--content);white-space:nowrap}
.row:hover{background:var(--code-bg)}
.row.sel{background:var(--code-bg);border-left-color:var(--accent);color:var(--primary);font-weight:600}
.caret{flex:0 0 10px;width:10px;color:var(--secondary);font-size:10px;text-align:center;transition:transform .12s}
.row.open>.caret{transform:rotate(90deg)}
.ico{flex:0 0 15px;width:15px;height:15px;color:var(--secondary)}
.row.dir>.ico{color:var(--accent)}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nm i{font-style:normal;color:var(--secondary);font-weight:400}
.sz{color:var(--secondary);font-size:11.5px;font-weight:400}
.lock{flex:0 0 auto;font:10px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--secondary);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-weight:400}
.dot{flex:0 0 6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.row{user-select:none;-webkit-user-select:none}
.row.msel{background:var(--code-bg);border-left-color:var(--secondary);color:var(--primary)}
.hint{padding:10px 14px;color:var(--secondary);font:12px var(--sans)}
.sort{padding:4px 6px;font-size:12px}
#mv{width:min(460px,calc(100vw - 32px))}
#mvl{max-height:min(46vh,360px);overflow:auto;margin:0 -6px 12px}
.mvo{display:block;width:100%;text-align:left;border:0;border-radius:5px;padding:6px 8px;font:13px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvo:hover,.mvo:focus-visible{background:var(--code-bg);border:0;outline:0}
.note{padding:28px 16px;text-align:center;color:var(--secondary);font:14px var(--sans)}
#bar{display:none;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--border)}
body.admin #bar{display:flex}
#into{flex:1 1 100%;font:12px var(--mono);color:var(--secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#into span{color:var(--primary)}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--border);min-height:49px}
.ptitle{flex:1 1 220px;min-width:0}
.ppath{font:14px var(--mono);color:var(--secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppath strong{color:var(--accent);font-weight:600}
.pmeta{font-size:12px;color:var(--secondary)}
.pmeta .pub{color:var(--ok)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button,.acts .btn{padding:4px 9px;font-size:12px}
#pbody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
#pbody iframe{flex:1;width:100%;min-height:360px;border:0;background:var(--theme)}
.ls{padding:12px 16px;font:13.5px/1.75 var(--mono);white-space:pre}
.ls a{text-decoration:none;color:var(--content);cursor:pointer}
.ls a:hover{text-decoration:underline;text-underline-offset:3px}
.ls a.d{color:var(--accent);font-weight:600}
.ls .t{color:var(--secondary);opacity:.55}
.ls .m{color:var(--secondary);font-size:12px}
#drop{position:fixed;inset:12px;display:none;align-items:center;justify-content:center;border:2px dashed var(--accent);border-radius:var(--radius);background:color-mix(in srgb,var(--theme) 86%,var(--accent));font:600 18px var(--sans);color:var(--primary);z-index:30;pointer-events:none}
#drop.on{display:flex}
#ups{position:fixed;right:20px;bottom:20px;width:min(340px,calc(100vw - 40px));display:flex;flex-direction:column;gap:8px;z-index:20}
.up{background:var(--theme);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;box-shadow:0 6px 22px rgba(0,0,0,.18)}
.uh{font:600 13.5px var(--sans);color:var(--primary)}
.up small{color:var(--secondary);font-size:12px}
.up small.e{color:var(--bad)}
.up .track{height:4px;margin-top:8px;border-radius:2px;background:var(--code-bg);overflow:hidden}
.up .fill{height:100%;width:0;background:var(--accent);transition:width .2s}
.ub{display:flex;gap:6px;margin-top:9px}
.ub button{padding:3px 9px;font-size:12px}
.ul{background:var(--theme);border:1px solid var(--border);border-radius:var(--radius);padding:4px 0;max-height:210px;overflow:auto;box-shadow:0 6px 22px rgba(0,0,0,.18)}
.ur{display:flex;gap:10px;align-items:baseline;padding:4px 13px;font:12px var(--mono);color:var(--content)}
.ur span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ur small{flex:0 0 auto;color:var(--secondary);font:11.5px var(--sans);max-width:55%;text-align:right}
.ur.err small{color:var(--bad)}
.row.drop{outline:1px dashed var(--accent);outline-offset:-2px;background:var(--code-bg)}
dialog{border:1px solid var(--border);border-radius:var(--radius);background:var(--theme);color:var(--content);padding:20px;width:min(380px,calc(100vw - 32px));box-shadow:0 12px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 6px;font-size:17px;color:var(--primary)}
dialog p{margin:0 0 12px;color:var(--secondary);font-size:14px;overflow-wrap:anywhere}
dialog input{width:100%;font:14px var(--mono);padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--code-bg);color:var(--primary);outline:0;margin-bottom:14px}
dialog input:focus{border-color:var(--accent)}
.dbtn{display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--primary);color:var(--theme);padding:7px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none}
#toast.on{opacity:1}
@media (max-width:820px){
  body{height:auto;min-height:100%}
  header{padding:0 14px}
  .brand{font-size:18px}
  .wrap{grid-template-columns:1fr;padding:0 14px 90px;gap:12px}
  #tree{max-height:44vh}
  #pbody iframe{min-height:70vh}
}
</style>

<body>
<header>
  <a class="brand" href="/">Priyanshu Debnath</a>
  <span class="here">/dump</span>
  <span class="sp"></span>
  <button class="icon" id="theme" title="Switch theme" aria-label="Switch theme">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
  <button id="lock">Unlock</button>
</header>
<div class="wrap">
  <section class="pane">
    <div class="prompt"><b>&#10095;</b><input id="q" placeholder="filter" autocomplete="off" spellcheck="false"><span id="count"></span></div>
    <div id="tree"><div class="note">Loading</div></div>
    <div id="bar">
      <div id="into"></div>
      <button class="pri" id="pick">Upload files</button>
      <button id="pickd">Upload folder</button>
      <button id="mk">New folder</button>
      <select id="vis" title="Visibility for new uploads and folders">
        <option value="private">Private</option>
        <option value="public">Public</option>
      </select>
      <input type="file" id="file" multiple hidden>
      <input type="file" id="dir" webkitdirectory multiple hidden>
    </div>
  </section>
  <section class="pane">
    <div class="phead"><div class="ptitle"><div class="ppath" id="ppath"></div><div class="pmeta" id="pmeta"></div></div><div class="acts" id="acts"></div></div>
    <div id="pbody"></div>
  </section>
</div>
<div id="drop">Drop to upload</div>
<div id="ups"></div>
<dialog id="dlg"><form method="dialog"><h3 id="dt"></h3><p id="dm"></p><input id="di" autocomplete="off"><div class="dbtn"><button type="button" id="dno">Cancel</button><button value="ok" class="pri" id="dok">OK</button></div></form></dialog>
<dialog id="mv"><h3 id="mvt"></h3><input id="mvq" placeholder="filter folders" autocomplete="off" spellcheck="false"><div id="mvl"></div><div class="dbtn"><button type="button" id="mvno">Cancel</button></div></dialog>
<div id="toast"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwm_yKrKMsbZZ4a0T39XJJY2CXq9HRNsGoTCJipW3YrsFWMzWFqOZ11CY0a6D6kGfAPSg/exec';
const CHUNK = 16 * 1024 * 1024;
const $ = (id) => document.getElementById(id);
const N = {};
const S = { sel: null, admin: false, q: '', rows: [], shown: null, tok: null, tokAt: 0, v: 1, multi: new Set(), anchor: null, found: null, searching: false, drag: null, sorts: {} };
try { S.sorts = JSON.parse(localStorage.getItem('dump_sort') || '{}') || {}; } catch (e) { S.sorts = {}; }
let ROOT = null;
const pw = () => { try { return localStorage.getItem('dump_pw') || ''; } catch (e) { return ''; } };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const ICON = {
  dir: '<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg>',
  file: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'
};

async function api(a, o) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ a, pw: pw() }, o || {}))
  });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

function toast(t, stick) {
  $('toast').textContent = t;
  $('toast').classList.add('on');
  clearTimeout(toast.t);
  if (!stick) toast.t = setTimeout(() => $('toast').classList.remove('on'), 2600);
}

function untoast() {
  clearTimeout(toast.t);
  $('toast').classList.remove('on');
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function ask(title, o) {
  o = o || {};
  return new Promise((res) => {
    const d = $('dlg');
    $('dt').textContent = title;
    $('dm').textContent = o.msg || '';
    $('dm').hidden = !o.msg;
    $('di').hidden = o.input === false;
    $('di').type = o.type || 'text';
    $('di').value = o.value || '';
    $('dok').textContent = o.ok || 'OK';
    d.returnValue = '';
    d.onclose = () => res(d.returnValue === 'ok' ? (o.input === false ? true : $('di').value.trim()) : null);
    d.showModal();
    if (o.input !== false) { $('di').focus(); $('di').select(); }
  });
}
$('dno').onclick = () => $('dlg').close('no');

function size(n) {
  if (!n) return '';
  const u = ['B', 'K', 'M', 'G', 'T'];
  let i = 0;
  while (n >= 1024 && i < 4) { n /= 1024; i++; }
  return (i ? n.toFixed(n < 10 ? 1 : 0) : n) + u[i];
}

const linkOf = (id) => location.origin + location.pathname + (id && id !== ROOT ? '#' + id : '');
const dlOf = (id) => 'https://drive.google.com/uc?export=download&id=' + id;

function pathOf(id) {
  const p = [];
  let n = N[id];
  while (n && n.id !== ROOT) { p.unshift(n.name); n = N[n.parent]; }
  return p;
}

function ingest(r) {
  S.admin = r.admin;
  S.v = r.v || 1;
  const c = r.crumbs;
  if (!ROOT) ROOT = c[0].id;
  c.forEach((x, i) => {
    if (r.file && i === c.length - 1) return;
    if (!N[x.id]) N[x.id] = { id: x.id, name: x.name, folder: true, vis: i ? 'private' : 'public', parent: i ? c[i - 1].id : null, kids: null, open: !i };
  });
  if (r.file) return;
  const self = c[c.length - 1].id;
  N[self].kids = r.items.map((it) => {
    const o = N[it.id] || (N[it.id] = { kids: null, open: false });
    Object.assign(o, it, { parent: self });
    return it.id;
  });
  sortKids(self);
}

async function loadDir(id) {
  ingest(await api('list', id ? { id } : {}));
}

function walk(onlyOpen) {
  const out = [];
  (function rec(id, depth, path) {
    const n = N[id];
    if (!n || !n.kids) return;
    n.kids.forEach((k) => {
      const c = N[k];
      const p = path + c.name + (c.folder ? '/' : '');
      out.push({ n: c, depth, path: p, dir: path });
      if (c.folder && (!onlyOpen || c.open)) rec(k, depth + 1, p);
    });
  })(ROOT, 0, '');
  return out;
}

function onRow(e, id) {
  if (S.admin && (e.ctrlKey || e.metaKey)) {
    if (!S.multi.size && S.sel && S.sel !== ROOT && S.sel !== id && N[S.sel]) S.multi.add(S.sel);
    if (S.multi.has(id)) S.multi.delete(id); else S.multi.add(id);
    S.anchor = id;
    render();
    return;
  }
  if (S.admin && e.shiftKey) {
    const a = S.rows.indexOf(S.anchor || S.sel);
    const b = S.rows.indexOf(id);
    if (a >= 0 && b >= 0) {
      S.multi = new Set(S.rows.slice(Math.min(a, b), Math.max(a, b) + 1));
      render();
      return;
    }
  }
  S.multi.clear();
  S.anchor = id;
  pick(id, true);
}

function renderTree() {
  const T = $('tree');
  const all = walk(false);
  let rows;
  if (S.found) {
    rows = S.found.filter((id) => N[id]).map((id) => ({ n: N[id], depth: 0, path: (N[id].spath || '') + N[id].name, dir: N[id].spath || '' }));
  } else if (S.q) {
    const t = S.q.toLowerCase().split(/\s+/).filter(Boolean);
    rows = all.filter((r) => t.every((x) => r.path.toLowerCase().includes(x)));
  } else {
    rows = walk(true);
  }
  const flat = !!(S.q || S.found);
  S.rows = rows.map((r) => r.n.id);
  $('count').textContent = S.found ? rows.length + ' found' : rows.length + '/' + all.length;
  T.textContent = '';
  if (!rows.length && !S.searching) {
    T.append(el('div', 'note', S.found ? 'No results in any folder' : S.q ? 'No match in open folders' : S.admin ? 'Empty. Drop files here to upload.' : 'Nothing here yet.'));
  }
  rows.forEach((r) => {
    const n = r.n;
    const row = el('div', 'row' + (n.folder ? ' dir' : '') + (n.open && !flat ? ' open' : '') + (n.id === S.sel && !S.multi.size ? ' sel' : '') + (S.multi.has(n.id) ? ' msel' : ''));
    row.dataset.id = n.id;
    if (!flat) row.style.paddingLeft = 11 + r.depth * 18 + 'px';
    row.append(el('span', 'caret', n.folder && !flat ? '▸' : ''));
    row.insertAdjacentHTML('beforeend', n.folder ? ICON.dir : ICON.file);
    const nm = el('span', 'nm');
    if (flat) { nm.append(el('i', '', r.dir)); nm.append(n.name + (n.folder ? '/' : '')); }
    else nm.textContent = n.name;
    nm.title = r.path;
    row.append(nm);
    if (S.admin && n.vis === 'public') { const d = el('span', 'dot'); d.title = 'Public'; row.append(d); }
    row.onclick = (e) => onRow(e, n.id);
    if (S.admin) {
      row.draggable = true;
      row.ondragstart = (e) => {
        S.drag = S.multi.has(n.id) ? Array.from(S.multi) : [n.id];
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', S.drag.length > 1 ? S.drag.length + ' items' : n.name);
      };
      row.ondragend = () => { S.drag = null; cool(); };
    }
    T.append(row);
  });
  if (S.searching) T.append(el('div', 'hint', 'Searching every folder'));
  else if (S.q && !S.found) T.append(el('div', 'hint', 'Press Enter to search every folder, including inside files'));
  const s = T.querySelector('.sel');
  if (s) s.scrollIntoView({ block: 'nearest' });
}

function btn(t, fn, cls) {
  const b = el('button', cls || '', t);
  b.onclick = fn;
  return b;
}

const SORTS = [['name', 'Name'], ['new', 'Newest'], ['old', 'Oldest'], ['big', 'Largest'], ['small', 'Smallest']];

function sortSelect(id) {
  const s = el('select', 'sort');
  s.title = 'Sort this folder';
  SORTS.forEach((o) => { const x = el('option', '', o[1]); x.value = o[0]; s.append(x); });
  s.value = S.sorts[id] || 'name';
  s.onchange = () => {
    if (s.value === 'name') delete S.sorts[id]; else S.sorts[id] = s.value;
    try { localStorage.setItem('dump_sort', JSON.stringify(S.sorts)); } catch (e) {}
    sortKids(id);
    render();
  };
  return s;
}

function fmtDate(d) {
  return d ? new Date(d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
}

function listing(ids, mode) {
  const L = el('div', 'ls');
  ids.forEach((k, i) => {
    const c = N[k];
    L.append(el('span', 't', i === ids.length - 1 ? '└── ' : '├── '));
    const a = el('a', c.folder ? 'd' : '', c.name + (c.folder ? '/' : ''));
    a.onclick = () => { S.multi.clear(); pick(c.id, false); };
    L.append(a);
    let m = '';
    if (!c.folder && (mode === 'big' || mode === 'small')) m = size(c.size) || '0B';
    if (mode === 'new' || mode === 'old') m = fmtDate(c.modified);
    if (m) L.append(el('span', 'm', '   ' + m));
    L.append('\n');
  });
  return L;
}

function renderMulti() {
  const ids = Array.from(S.multi).filter((id) => N[id]);
  const P = $('ppath');
  P.textContent = '';
  P.append(el('strong', '', ids.length + ' selected'));
  P.title = '';
  const dirs = ids.filter((id) => N[id].folder).length;
  const files = ids.length - dirs;
  const bytes = ids.reduce((a, id) => a + (N[id].folder ? 0 : N[id].size || 0), 0);
  const bits = [];
  if (files) bits.push(files + (files === 1 ? ' file' : ' files'));
  if (dirs) bits.push(dirs + (dirs === 1 ? ' folder' : ' folders'));
  if (bytes) bits.push(size(bytes));
  $('pmeta').textContent = bits.join(' · ');
  const A = $('acts');
  A.textContent = '';
  A.append(btn('Move', () => moveVia(ids)));
  A.append(btn('Make public', () => visItems(ids, 'public')));
  A.append(btn('Make private', () => visItems(ids, 'private')));
  A.append(btn('Delete', () => trashItems(ids), 'bad'));
  A.append(btn('Clear', () => { S.multi.clear(); render(); }));
  const B = $('pbody');
  const key = 'multi:' + ids.join(',');
  if (S.shown === key) return;
  S.shown = key;
  B.textContent = '';
  B.append(listing(ids, 'name'));
}

function renderPreview() {
  if (S.multi.size) { renderMulti(); return; }
  const n = N[S.sel] || N[ROOT];
  if (!n) return;
  const p = pathOf(n.id);
  const P = $('ppath');
  P.textContent = '';
  P.append('dump/' + p.slice(0, -1).map((x) => x + '/').join(''));
  if (p.length) P.append(el('strong', '', p[p.length - 1] + (n.folder ? '/' : '')));
  P.title = 'dump/' + p.join('/');
  const M = $('pmeta');
  M.textContent = '';
  const bits = [];
  if (n.folder) bits.push(n.kids ? n.kids.length + (n.kids.length === 1 ? ' item' : ' items') : 'loading');
  else { if (n.size) bits.push(size(n.size)); if (n.modified) bits.push(fmtDate(n.modified)); }
  M.append(bits.join(' · '));
  if (S.admin && n.id !== ROOT) { M.append(' · '); M.append(el('span', n.vis === 'public' ? 'pub' : '', n.vis)); }
  const A = $('acts');
  A.textContent = '';
  if (n.folder && n.kids && n.kids.length > 1) A.append(sortSelect(n.id));
  A.append(btn('Copy link', () => copy(n.id)));

  if (S.admin && n.id !== ROOT) {
    A.append(btn(n.vis === 'public' ? 'Make private' : 'Make public', () => visItems([n.id], n.vis === 'public' ? 'private' : 'public')));
    A.append(btn('Move', () => moveVia([n.id])));
    A.append(btn('Rename', () => rename(n)));
    A.append(btn('Delete', () => trashItems([n.id]), 'bad'));
  }
  const B = $('pbody');
  const mode = S.sorts[n.id] || 'name';
  const key = n.id + (n.folder ? ':' + mode + ':' + (n.kids ? n.kids.map((k) => N[k].name + N[k].vis).join('|') : '') + S.admin : '');
  if (S.shown === key) return;

  B.textContent = '';

    B.append(f);
    return;
  }
  if (!n.kids) { B.append(el('div', 'note', 'Loading')); return; }
  if (!n.kids.length) { B.append(el('div', 'note', S.admin ? 'Empty folder. Drop files here to upload.' : 'Empty folder.')); return; }
  B.append(listing(n.kids, mode));
}

function render() {
  document.body.classList.toggle('admin', S.admin);
  $('lock').textContent = S.admin ? 'Lock' : 'Unlock';
  const d = N[curDir()];
  $('into').textContent = 'Uploads go to ';

  renderTree();
  renderPreview();
}

function curDir() {
  const n = N[S.sel];
  return n ? (n.folder ? n.id : n.parent) : ROOT;
}

async function pick(id, toggle) {
  const n = N[id];
  if (!n) return;
  const was = S.sel === id;
  S.sel = id;
  history.replaceState(null, '', id === ROOT ? location.pathname : '#' + id);
  const par = N[n.parent];
  if (id !== ROOT && (!par || !par.kids || !par.kids.includes(id))) {
    render();
    try { await reveal(id); } catch (e) { toast(e.message); }
    if (S.sel === id) render();
    return;
  }
  if (n.folder) {
    n.open = toggle && was ? !n.open : true;
    let p = N[n.parent];
    while (p) { p.open = true; p = N[p.parent]; }
  }
  render();
  if (n.folder && !n.kids) {
    try { await loadDir(id); } catch (e) { toast(e.message); }
    render();
  }
}

async function reveal(id) {
  const r = await api('list', { id });
  ingest(r);
  const c = r.crumbs;
  await Promise.all(c.slice(1, -1).map((x) => loadDir(x.id)));
  if (r.file && !N[id]) N[id] = Object.assign({ kids: null, open: false }, r.file, { parent: c.length > 1 ? c[c.length - 2].id : ROOT });
  for (let i = 1; i < c.length; i++) {
    const p = N[c[i - 1].id];
    const n = N[c[i].id];
    if (!p || !n || !p.kids) continue;
    if (!p.kids.includes(n.id)) { n.parent = p.id; if (!S.admin) n.vis = 'public'; p.kids.push(n.id); }
  }
  c.forEach((x) => { if (N[x.id] && N[x.id].folder) N[x.id].open = true; });
  S.sel = id;
}

async function init() {
  const id = location.hash.slice(1);
  Object.keys(N).forEach((k) => delete N[k]);
  ROOT = null;
  S.shown = null;
  S.multi.clear();
  S.found = null;
  S.searching = false;
  try {
    await loadDir('');
    S.sel = ROOT;
    if (id && id !== ROOT) {
      try { await reveal(id); }
      catch (e) { toast(e.message === 'Not found' ? 'That item is private or no longer exists' : e.message); history.replaceState(null, '', location.pathname); }

    $('tree').textContent = '';

async function copy(id) {

  catch (e) { ask('Copy this link', { value: linkOf(id) }); }
}

async function rename(n) {
  const name = await ask('Rename', { value: n.name, ok: 'Rename' });
  if (!name || name === n.name) return;
  try { await api('rename', { id: n.id, name }); n.name = name; sortKids(n.parent); S.shown = null; render(); }
  catch (e) { toast(e.message); }
}

const NEEDS = 'Update and redeploy the Apps Script to use this';

function isUnder(id, anc) {
  let x = id;
  for (let i = 0; i < 40 && x; i++) {
    if (x === anc) return true;
    x = N[x] ? N[x].parent : null;
  }
  return false;
}

function topLevel(ids) {
  const set = new Set(ids);
  return ids.filter((id) => {
    let p = N[id] ? N[id].parent : null;
    for (let i = 0; i < 40 && p; i++) {
      if (set.has(p)) return false;
      p = N[p] ? N[p].parent : null;
    }
    return true;
  });
}

async function batch(a, ids, extra, label) {
  const done = [];
  const failed = [];
  const step = S.v >= 2 ? 15 : 1;
  for (let i = 0; i < ids.length; i += step) {
    const part = ids.slice(i, i + step);
    if (ids.length > 1) toast(label + ' ' + Math.min(i + step, ids.length) + ' of ' + ids.length, true);
    try {
      if (S.v >= 2) {
        const r = await api(a, Object.assign({ ids: part }, extra));
        done.push.apply(done, r.done);
        failed.push.apply(failed, r.failed);
      } else {
        await api(a, Object.assign({ id: part[0] }, extra));
        done.push(part[0]);
      }
    } catch (e) {
      part.forEach((id) => failed.push({ id, error: e.message }));
    }
  }
  untoast();
  return { done, failed };
}

function report(r, verb) {
  if (r.failed.length) toast((r.done.length ? r.done.length + ' ' + verb + ', ' : '') + r.failed.length + ' failed: ' + r.failed[0].error);
  else toast(r.done.length + (r.done.length === 1 ? ' item ' : ' items ') + verb);
}

function detach(id) {
  const p = N[N[id].parent];
  if (p && p.kids) p.kids = p.kids.filter((k) => k !== id);
}

async function visItems(ids, vis) {
  ids = ids.filter((id) => N[id] && id !== ROOT && N[id].vis !== vis);
  if (!ids.length) { toast('Already ' + vis); return; }
  const r = await batch('vis', ids, { vis }, 'Updating');
  r.done.forEach((id) => { if (N[id]) N[id].vis = vis; });
  S.shown = null;
  render();
  if (r.failed.length) report(r, 'updated'); else toast(ids.length === 1 ? 'Now ' + vis : r.done.length + ' items now ' + vis);
}

async function trashItems(ids) {
  ids = topLevel(ids.filter((id) => N[id] && id !== ROOT));
  if (!ids.length) return;
  const ok = await ask('Delete', { msg: ids.length === 1 ? 'Move "' + N[ids[0]].name + '" to your Drive trash?' : 'Move ' + ids.length + ' items to your Drive trash?', input: false, ok: 'Delete' });
  if (!ok) return;
  const r = await batch('trash', ids, {}, 'Deleting');
  let next = null;
  r.done.forEach((id) => {
    if (!N[id]) return;
    if (S.sel && isUnder(S.sel, id)) next = N[id].parent;
    detach(id);
    if (S.found) S.found = S.found.filter((x) => !isUnder(x, id));
  });
  if (next || (S.sel && !N[S.sel])) S.sel = N[next] ? next : ROOT;
  r.done.forEach((id) => { delete N[id]; });
  S.multi.clear();
  S.shown = null;
  history.replaceState(null, '', S.sel === ROOT ? location.pathname : '#' + S.sel);
  render();
  report(r, 'deleted');
}

async function moveItems(ids, to) {
  if (S.v < 2) { toast(NEEDS); return; }
  ids = topLevel(ids.filter((id) => N[id] && id !== ROOT));
  const bad = ids.filter((id) => N[id].folder && isUnder(to, id));
  ids = ids.filter((id) => N[id].parent !== to && !bad.includes(id));
  if (!ids.length) { toast(bad.length ? 'A folder cannot be moved into itself' : 'Already in that folder'); return; }
  const r = await batch('move', ids, { to }, 'Moving');
  r.done.forEach((id) => {
    if (!N[id]) return;
    detach(id);
    N[id].parent = to;
    const t = N[to];
    if (t && t.kids && !t.kids.includes(id)) t.kids.push(id);
  });
  if (N[to] && N[to].kids) { sortKids(to); N[to].open = true; }
  if (S.found) S.found = null;
  S.multi.clear();
  S.shown = null;
  render();
  report(r, 'moved');
}

function chooseDir(ids) {
  return new Promise(async (res) => {
    if (S.v < 2) { toast(NEEDS); res(null); return; }
    toast('Loading folders', true);
    let r;
    try { r = await api('dirs'); } catch (e) { toast(e.message); res(null); return; }
    untoast();
    const par = {};
    r.dirs.forEach((d) => { par[d.id] = d.parent; });
    const moving = new Set(ids);
    const banned = (id) => { for (let i = 0; i < 40 && id; i++) { if (moving.has(id)) return true; id = par[id]; } return false; };
    const same = ids.every((id) => N[id] && N[id].parent === N[ids[0]].parent) ? N[ids[0]].parent : null;
    const opts = [{ id: ROOT, path: '' }].concat(r.dirs).filter((d) => !banned(d.id) && d.id !== same);
    const d = $('mv');
    let chosen = null;
    const draw = () => {
      const t = $('mvq').value.toLowerCase().split(/\s+/).filter(Boolean);
      const L = $('mvl');
      L.textContent = '';
      const show = opts.filter((o) => t.every((x) => ('dump/' + o.path).toLowerCase().includes(x)));
      if (!show.length) L.append(el('div', 'note', opts.length ? 'No folder matches' : 'No other folder to move to'));
      show.forEach((o) => {
        const b = el('button', 'mvo', 'dump/' + o.path);
        b.type = 'button';
        b.onclick = () => { chosen = o.id; d.close(); };
        L.append(b);
      });
    };
    $('mvt').textContent = ids.length === 1 ? 'Move "' + N[ids[0]].name + '" to' : 'Move ' + ids.length + ' items to';
    $('mvq').value = '';
    $('mvq').oninput = draw;
    d.onclose = () => res(chosen);
    draw();
    d.showModal();
    $('mvq').focus();
  });
}

async function moveVia(ids) {
  const to = await chooseDir(ids);
  if (to) await moveItems(ids, to);
}

async function searchAll() {
  const q = S.q;
  if (q.length < 2) { toast('Type at least 2 characters'); return; }
  if (S.v < 2) { toast(NEEDS); return; }
  S.searching = true;
  S.found = null;
  renderTree();
  try {
    const r = await api('search', { q });
    if (S.q !== q) return;
    r.items.forEach((it) => {
      const o = N[it.id] || (N[it.id] = { kids: null, open: false });
      Object.assign(o, it);
      o.spath = it.path || '';
      delete o.path;
    });
    S.found = r.items.map((i) => i.id);
  } catch (e) {
    toast(e.message);
  } finally {
    if (S.q === q) { S.searching = false; S.multi.clear(); render(); }
  }
}

async function mkdir() {
  const dir = curDir();
  const name = await ask('New folder', { ok: 'Create' });
  if (!name) return;
  try {
    await api('mkdir', { id: dir, name, vis: $('vis').value });
    await loadDir(dir === ROOT ? '' : dir);
    N[dir].open = true;
    render();
  } catch (e) { toast(e.message); }
}

const U = { jobs: [], active: 0, names: {}, raf: 0, auto: 0, rt: 0 };
const JUNK = /^(\.DS_Store|Thumbs\.db|desktop\.ini|\._.*)$/i;
const UPLOAD_URL = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id';
const pending = () => U.jobs.some((j) => j.state === 'wait' || j.state === 'run');

async function token(force) {
  if (force || !S.tok || Date.now() - S.tokAt > 40 * 60 * 1000) {
    S.tok = (await api('token')).token;
    S.tokAt = Date.now();
  }
  return S.tok;
}

function put(j, url, headers, body, onp) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    j.xhr = x;
    x.open('PUT', url);
    Object.keys(headers).forEach((k) => x.setRequestHeader(k, headers[k]));
    if (onp) x.upload.onprogress = (e) => onp(e.loaded);
    x.onload = () => res({ status: x.status, range: x.getResponseHeader('Range'), text: x.responseText });
    x.onerror = () => rej(new Error('Network error'));
    x.onabort = () => rej(new Error('Cancelled'));
    x.send(body);
  });
}

async function gerr(r, fallback) {
  try { const t = await r.json(); return (t.error && t.error.message) || fallback; }
  catch (e) { return fallback; }
}

async function startSession(j, pid) {
  for (let a = 0; a < 2; a++) {
    const t = await token(a > 0);
    const h = { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json; charset=UTF-8', 'X-Upload-Content-Length': String(j.file.size) };
    if (j.file.type) h['X-Upload-Content-Type'] = j.file.type;
    const r = await fetch(UPLOAD_URL, { method: 'POST', headers: h, body: JSON.stringify({ name: j.name, parents: [pid], description: j.vis }) });
    if (r.status === 401 && !a) continue;
    if (!r.ok) throw new Error(await gerr(r, 'Could not start upload (' + r.status + ')'));
    const u = r.headers.get('Location');
    if (!u) throw new Error('No upload session returned');
    return u;
  }
}

async function makePublic(id) {
  try {
    const r = await fetch('https://www.googleapis.com/drive/v3/files/' + id + '/permissions', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + (await token()), 'Content-Type': 'application/json' },
      body: JSON.stringify({ role: 'reader', type: 'anyone' })
    });
    if (r.ok) return;
  } catch (e) {}
  await api('vis', { id, vis: 'public' });
}

async function upload(j, pid) {
  const file = j.file;
  const total = file.size;
  const next = (r, fallback) => (r.range ? Number(r.range.split('-')[1]) + 1 : fallback);
  const stop = () => { if (j.state === 'cancel') throw new Error('Cancelled'); };
  let off = 0;
  let fails = 0;
  let done = null;
  const probe = async () => {
    const p = await put(j, j.url, { 'Content-Range': 'bytes */' + total }, new Blob([]));
    if (p.status === 200 || p.status === 201) done = JSON.parse(p.text);
    else if (p.status === 308) off = next(p, 0);
    else if (p.status === 404 || p.status === 410) j.url = null;
  };
  if (j.url && total) { try { await probe(); } catch (e) { stop(); } }
  if (!j.url) { j.url = await startSession(j, pid); off = 0; }
  stop();
  if (!total && !done) {
    const r = await put(j, j.url, {}, new Blob([]));
    if (r.status >= 300) throw new Error('Upload failed (' + r.status + ')');
    done = JSON.parse(r.text);
  }
  while (!done) {
    stop();
    const end = Math.min(off + CHUNK, total);
    let r;
    try {
      r = await put(j, j.url, { 'Content-Range': 'bytes ' + off + '-' + (end - 1) + '/' + total }, file.slice(off, end), (n) => { j.sent = off + n; draw(); });
    } catch (e) {
      stop();
      r = { status: 503 };
    }
    if (r.status === 200 || r.status === 201) { done = JSON.parse(r.text); break; }
    if (r.status === 308) { off = next(r, end); fails = 0; j.sent = off; draw(); continue; }
    if (r.status >= 500 || r.status === 429) {
      if (++fails > 10) throw new Error(navigator.onLine === false ? 'You are offline' : 'Upload kept failing');
      await sleep(Math.min(30000, 1500 * fails));
      stop();
      try { await probe(); } catch (e) { stop(); }
      if (!j.url) throw new Error('Upload session expired');
      continue;
    }
    j.url = null;
    throw new Error(r.status === 403 ? 'Drive refused the upload (storage or rate limit)' : 'Upload failed (' + r.status + ')');
  }
  j.sent = total;
  if (j.vis === 'public') await makePublic(done.id);
  return done.id;
}

function kidsReady(id) {
  return N[id].kids ? Promise.resolve() : loadDir(id === ROOT ? '' : id);
}

function sortKids(pid) {
  const d = N[pid];
  if (!d || !d.kids) return;
  const m = S.sorts[pid] || 'name';
  const t = (x) => (x.modified ? Date.parse(x.modified) || 0 : 0);
  d.kids = d.kids.filter((k) => N[k]);
  d.kids.sort((a, b) => {
    const A = N[a];
    const B = N[b];
    if (!!A.folder !== !!B.folder) return A.folder ? -1 : 1;
    let c = 0;
    if (m === 'new') c = t(B) - t(A);
    else if (m === 'old') c = t(A) - t(B);
    else if (m === 'big') c = (B.size || 0) - (A.size || 0);
    else if (m === 'small') c = (A.size || 0) - (B.size || 0);
    return c || A.name.localeCompare(B.name, undefined, { numeric: true, sensitivity: 'base' });
  });
}

function ensureDir(target, path, vis, memo) {
  if (!path.length) return kidsReady(target).then(() => target);
  const key = path.join('/');
  if (!memo[key]) {
    memo[key] = ensureDir(target, path.slice(0, -1), vis, memo).then(async (pid) => {
      const name = path[path.length - 1];
      const ex = N[pid].kids.map((k) => N[k]).find((c) => c.folder && c.name === name);
      N[pid].open = true;
      if (ex) { await kidsReady(ex.id); ex.open = true; return ex.id; }
      const r = await api('mkdir', { id: pid, name, vis });
      N[r.id] = { id: r.id, name, folder: true, vis, parent: pid, kids: [], open: false, size: 0, modified: new Date().toISOString() };
      N[pid].kids.push(r.id);
      sortKids(pid);
      return r.id;
    }).catch((e) => { delete memo[key]; throw e; });
  }
  return memo[key];
}

function uniq(name, pid) {
  const used = new Set(N[pid].kids.map((k) => N[k].name));
  (U.names[pid] || []).forEach((x) => used.add(x));
  let out = name;
  if (used.has(out)) {
    const d = name.lastIndexOf('.');
    const b = d > 0 ? name.slice(0, d) : name;
    const x = d > 0 ? name.slice(d) : '';
    let i = 1;
    do { out = b + ' (' + i++ + ')' + x; } while (used.has(out));
  }
  (U.names[pid] || (U.names[pid] = new Set())).add(out);
  return out;
}

function softRender() {
  if (U.rt) return;
  U.rt = setTimeout(() => { U.rt = 0; render(); }, 350);
}

async function run(j) {
  j.state = 'run';
  j.err = null;
  U.active++;
  draw();
  try {
    const pid = await ensureDir(j.target, j.path, j.vis, j.memo);
    if (j.state === 'cancel') throw new Error('Cancelled');
    if (!j.name) j.name = uniq(j.file.name, pid);
    const id = await upload(j, pid);
    N[id] = { id, name: j.name, folder: false, mime: j.file.type, size: j.file.size, modified: new Date().toISOString(), vis: j.vis, parent: pid, kids: null, open: false };
    N[pid].kids.push(id);
    sortKids(pid);
    j.state = 'done';
  } catch (e) {
    if (j.state !== 'cancel') { j.state = 'err'; j.err = (e && e.message) || String(e); }
  }
  j.xhr = null;
  U.active--;
  U.jobs = U.jobs.filter((x) => x.state !== 'cancel');
  draw();
  softRender();
  pump();
}

function pump() {
  while (U.active < 3) {
    const j = U.jobs.find((x) => x.state === 'wait');
    if (!j) break;
    run(j);
  }
  if (!pending() && U.jobs.length && !U.jobs.some((j) => j.state === 'err')) {
    clearTimeout(U.auto);
    U.auto = setTimeout(() => { if (!pending()) clearJobs(); }, 4000);
  }
}

function clearJobs() {
  U.jobs = [];
  U.names = {};
  draw();
}

function cancelAll() {
  U.jobs.forEach((j) => {
    if (j.state === 'run') { j.state = 'cancel'; if (j.xhr) j.xhr.abort(); }
  });
  U.jobs = U.jobs.filter((j) => j.state !== 'wait');
  draw();
}

function retryFailed() {
  U.jobs.forEach((j) => { if (j.state === 'err') { j.state = 'wait'; j.err = null; } });
  draw();
  pump();
}

function draw() {
  if (U.raf) return;
  U.raf = requestAnimationFrame(() => {
    U.raf = 0;
    const P = $('ups');
    P.textContent = '';
    if (!U.jobs.length) return;
    const total = U.jobs.length;
    const done = U.jobs.filter((j) => j.state === 'done').length;
    const errs = U.jobs.filter((j) => j.state === 'err');
    const busy = pending();
    const bytes = U.jobs.reduce((a, j) => a + j.file.size, 0);
    const sent = U.jobs.reduce((a, j) => a + (j.state === 'done' ? j.file.size : j.sent || 0), 0);
    const box = el('div', 'up');
    box.append(el('div', 'uh', busy ? 'Uploading ' + done + ' of ' + total : done + ' of ' + total + ' uploaded'));
    const sub = [];
    if (bytes) sub.push(size(sent) + ' of ' + size(bytes));
    if (errs.length) sub.push(errs.length + ' failed');
    box.append(el('small', errs.length ? 'e' : '', sub.join(' · ')));
    const track = el('div', 'track');
    const fill = el('div', 'fill');
    fill.style.width = (bytes ? (sent / bytes) * 100 : total ? (done / total) * 100 : 0) + '%';
    track.append(fill);
    box.append(track);
    const bs = el('div', 'ub');
    if (busy) bs.append(btn('Cancel', cancelAll));
    if (!busy && errs.length) bs.append(btn('Retry failed', retryFailed));
    if (!busy) bs.append(btn('Dismiss', clearJobs));
    box.append(bs);
    P.append(box);
    const list = el('div', 'ul');
    const show = U.jobs.filter((j) => j.state === 'run').concat(errs);
    show.slice(0, 6).forEach((j) => {
      const r = el('div', 'ur' + (j.state === 'err' ? ' err' : ''));
      r.append(el('span', '', (j.path.length ? j.path.join('/') + '/' : '') + (j.name || j.file.name)));
      r.append(el('small', '', j.state === 'err' ? j.err : j.file.size ? Math.floor(((j.sent || 0) / j.file.size) * 100) + '%' : ''));
      list.append(r);
    });
    if (show.length > 6) list.append(el('div', 'ur', '+ ' + (show.length - 6) + ' more'));
    if (show.length) P.append(list);
  });
}

function addFiles(list, dirs, target) {
  if (!S.admin) { toast('Unlock first'); return; }
  if (!N[target] || !N[target].folder) target = ROOT;
  const vis = $('vis').value;
  const memo = {};
  let skipped = 0;
  let added = 0;
  list.forEach((x) => {
    if (JUNK.test(x.file.name)) { skipped++; return; }
    U.jobs.push({ file: x.file, path: x.path, target, vis, memo, sent: 0, state: 'wait', url: null, name: null });
    added++;
  });
  let chain = Promise.resolve();
  (dirs || []).forEach((p) => { chain = chain.then(() => ensureDir(target, p, vis, memo)).then(softRender, () => {}); });
  if (!added && !(dirs || []).length) { toast(skipped ? 'Only system files, nothing uploaded' : 'Nothing to upload'); return; }
  if (skipped) toast('Skipped ' + skipped + ' system file' + (skipped > 1 ? 's' : ''));
  N[target].open = true;
  clearTimeout(U.auto);
  draw();
  pump();
}

function readAll(reader) {
  return new Promise((res) => {
    const out = [];
    (function more() {
      reader.readEntries((b) => { if (!b.length) res(out); else { out.push.apply(out, b); more(); } }, () => res(out));
    })();
  });
}

async function crawl(entry, path, files, dirs) {
  if (entry.isFile) {
    try { files.push({ file: await new Promise((res, rej) => entry.file(res, rej)), path }); } catch (e) {}
    return;
  }
  if (!entry.isDirectory) return;
  const here = path.concat(entry.name);
  dirs.push(here);
  const kids = await readAll(entry.createReader());
  for (const k of kids) await crawl(k, here, files, dirs);
}

async function fromDrop(dt, target) {
  const entries = [];
  const files = [];
  const items = dt.items ? Array.from(dt.items) : [];
  items.forEach((it) => {
    if (it.kind !== 'file') return;
    const en = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
    if (en) entries.push(en);
    else { const f = it.getAsFile(); if (f) files.push({ file: f, path: [] }); }
  });
  if (!items.length) Array.from(dt.files || []).forEach((f) => files.push({ file: f, path: [] }));
  const dirs = [];
  if (entries.some((e) => e.isDirectory)) toast('Reading folder');
  for (const en of entries) await crawl(en, [], files, dirs);
  addFiles(files, dirs, target);
}

function rowDir(e) {
  const row = e.target && e.target.closest ? e.target.closest('.row') : null;
  const n = row ? N[row.dataset.id] : null;
  return { row, dir: n ? (n.folder ? n.id : n.parent) : curDir() };
}

$('lock').onclick = async () => {
  if (S.admin) {
    if (pending()) { toast('Wait for uploads to finish or cancel them'); return; }
    try { localStorage.removeItem('dump_pw'); } catch (e) {}
    S.tok = null;
    clearJobs();
    await init();
    return;
  }
  const p = await ask('Unlock', { type: 'password', ok: 'Unlock' });
  if (!p) return;
  try { localStorage.setItem('dump_pw', p); } catch (e) {}
  await init();
  if (!S.admin) { try { localStorage.removeItem('dump_pw'); } catch (e) {} toast('Wrong password'); }
};
$('theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('pref-theme', t); } catch (e) {}
};
$('pick').onclick = () => $('file').click();
$('file').onchange = (e) => { addFiles(Array.from(e.target.files).map((f) => ({ file: f, path: [] })), [], curDir()); e.target.value = ''; };
if ('webkitdirectory' in $('dir')) $('pickd').onclick = () => $('dir').click();
else $('pickd').hidden = true;
$('dir').onchange = (e) => {
  const fs = Array.from(e.target.files);
  if (!fs.length) toast('That folder is empty');
  else addFiles(fs.map((f) => ({ file: f, path: (f.webkitRelativePath || '').split('/').slice(0, -1) })), [], curDir());
  e.target.value = '';
};
$('mk').onclick = mkdir;
$('q').oninput = (e) => { S.q = e.target.value.trim(); S.found = null; S.searching = false; S.multi.clear(); render(); };
$('mvno').onclick = () => $('mv').close();
document.addEventListener('paste', (e) => {
  if (!S.admin || $('dlg').open) return;
  const fs = e.clipboardData ? Array.from(e.clipboardData.files || []) : [];
  if (!fs.length) return;
  e.preventDefault();
  addFiles(fs.map((f) => ({ file: f, path: [] })), [], curDir());
});
document.addEventListener('keydown', (e) => {
  if ($('dlg').open || $('mv').open) return;
  const inQ = document.activeElement === $('q');
  if (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && !inQ) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/' && !inQ) { e.preventDefault(); $('q').focus(); return; }
  if (e.key === 'Enter' && inQ) { e.preventDefault(); searchAll(); return; }
  if (e.key === 'Escape' && inQ) { $('q').value = ''; S.q = ''; S.found = null; S.searching = false; S.multi.clear(); $('q').blur(); render(); return; }
  if (e.key === 'Escape' && S.multi.size) { S.multi.clear(); render(); return; }
  const i = S.rows.indexOf(S.sel);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!S.rows.length) return;
    e.preventDefault();
    const j = e.key === 'ArrowDown' ? Math.min(S.rows.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1);
    S.multi.clear();
    S.anchor = S.rows[j];
    pick(S.rows[j], false);
  } else if (e.key === 'ArrowLeft' && !inQ && N[S.sel] && S.sel !== ROOT) {
    const n = N[S.sel];
    if (n.folder && n.open) { n.open = false; render(); } else pick(n.parent, false);
  }
});
let depth = 0;
let hot = null;
const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
const cool = () => { if (hot) hot.classList.remove('drop'); hot = null; };
window.addEventListener('dragenter', (e) => { if (hasFiles(e) && S.admin) { depth++; $('drop').classList.add('on'); } });
window.addEventListener('dragleave', () => { if (S.drag) return; if (--depth <= 0) { depth = 0; $('drop').classList.remove('on'); cool(); } });
function moveTarget(e) {
  const row = e.target && e.target.closest ? e.target.closest('.row') : null;
  const n = row ? N[row.dataset.id] : null;
  if (n) return { row: n.folder ? row : null, to: n.folder ? n.id : n.parent };
  return { row: null, to: e.target && e.target.closest && e.target.closest('#tree') ? ROOT : null };
}
window.addEventListener('dragover', (e) => {
  if (S.drag) {
    const t = moveTarget(e);
    if (t.to) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
    if (t.row !== hot) { cool(); hot = t.row; if (hot) hot.classList.add('drop'); }
    return;
  }
  if (!hasFiles(e)) return;
  e.preventDefault();
  if (!S.admin) return;
  const t = rowDir(e);
  if (t.row !== hot) { cool(); hot = t.row; if (hot) hot.classList.add('drop'); }
  $('drop').textContent = 'Drop to upload to dump/' + pathOf(t.dir).map((x) => x + '/').join('');
});
window.addEventListener('drop', (e) => {
  if (S.drag) {
    e.preventDefault();
    const t = moveTarget(e);
    const ids = S.drag;
    S.drag = null;
    cool();
    if (t.to) moveItems(ids, t.to);
    return;
  }
  if (!hasFiles(e)) return;
  e.preventDefault();
  depth = 0;
  $('drop').classList.remove('on');
  const t = rowDir(e);
  cool();
  if (!S.admin) { toast('Unlock first'); return; }
  fromDrop(e.dataTransfer, t.dir);
});
window.addEventListener('beforeunload', (e) => { if (pending()) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1) || ROOT;
  if (N[id]) pick(id, false);
  else if (pending()) toast('Finish or cancel uploads first');
  else init();
});
init();
</script>
</body>
