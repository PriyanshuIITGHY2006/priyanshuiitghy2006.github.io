# Flags dead links in the built site's posts and pages before they rot
# silently. Runs on every PR and push, plus weekly to catch links that go
# dead after merge.
name: Check links

on:
  pull_request:
  push:
    branches: ["Website"]
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

env:
  HUGO_VERSION: "0.168.0"

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Hugo site
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" hugo
          "$RUNNER_TEMP/hugo" --baseURL /

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}/public"
            --exclude "^https://(www\.)?linkedin\.com"
            --exclude "^https://codeforces\.com"
            --exclude "^https://(x|twitter)\.com"
            --exclude "^https://(www\.)?(reddit|facebook)\.com"
            --exclude "^https://(api\.whatsapp\.com|telegram\.me|news\.ycombinator\.com)"
            --exclude "^https://(www\.)?researchgate\.net"
            --exclude "^https://discord\.com"
            --exclude "supabase\.co"
            'public/posts/**/index.html'
            'public/about/index.html'
          format: markdown
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
