# Build the Hugo site (public pages) and the Vite admin app (/admin), and deploy both to Pages.
name: Build & deploy to Pages

on:
  push:
    branches: ["Website"]
    # LaTeX sources don't affect the site; latex-pdf.yml compiles them and
    # dispatches this workflow once the PDF is committed.
    paths-ignore: ["latex/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, needed to diff against github.event.before below

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      # /admin is still the Vite app. Everything else is the Hugo site, which is
      # copied over the top of it below.
      - name: Build admin app
        run: npm run build:site
        env:
          VITE_ONLINE_COMPILER_KEY: ${{ secrets.VITE_ONLINE_COMPILER_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Build Hugo site
        env:
          HUGO_PARAMS_SUPABASEANONKEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.168.0/hugo_extended_0.168.0_linux-amd64.tar.gz | tar -xz hugo
          ./hugo --source hugo-site --destination "$RUNNER_TEMP/hugo-out" --baseURL https://priyanshudebnath.me/ --minify

      - name: Assemble site
        run: |
          # GitHub Pages serves 404.html for unknown paths. Keep the admin app's
          # shell there so a hard load of /admin still boots the app.
          cp dist/index.html dist/404.html
          rm -f dist/legacy.html
          # Hugo's output wins everywhere except 404.html.
          rm -f "$RUNNER_TEMP/hugo-out/404.html"
          cp -a "$RUNNER_TEMP/hugo-out/." dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
