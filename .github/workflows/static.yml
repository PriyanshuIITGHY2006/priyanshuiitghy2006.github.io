# Build the Vite/TypeScript site and deploy the resulting dist/ to Pages.
name: Build & deploy to Pages

on:
  push:
    branches: ["Website"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, needed to diff against github.event.before below

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_ONLINE_COMPILER_KEY: ${{ secrets.VITE_ONLINE_COMPILER_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify subscribers about new posts
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          INTERNAL_WEBHOOK_SECRET: ${{ secrets.INTERNAL_WEBHOOK_SECRET }}
          SUPABASE_FUNCTIONS_URL: https://vadbagtnekrjwrimvgxe.supabase.co/functions/v1
        run: |
          added=$(git diff --name-only --diff-filter=A "${{ github.event.before }}" "${{ github.sha }}" -- 'src/data/blogs/*.md' || true)
          if [ -z "$added" ]; then
            echo "No new blog posts in this push."
          else
            echo "$added" | while IFS= read -r file; do
              [ -n "$file" ] && node scripts/notify-new-post.mjs "$file"
            done
          fi
