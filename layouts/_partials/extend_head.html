{{- /* Rendering the content first lets render-passthrough.html mark pages that have math. */ -}}
{{- $noop := .WordCount }}
{{- if .Store.Get "hasMath" }}
<link rel="stylesheet" href="{{ "katex/katex.min.css" | relURL }}">
{{- /* The two fonts almost every formula uses, fetched alongside the stylesheet instead of after it. */}}
<link rel="preload" href="{{ "katex/fonts/KaTeX_Main-Regular.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ "katex/fonts/KaTeX_Math-Italic.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
{{- end }}
