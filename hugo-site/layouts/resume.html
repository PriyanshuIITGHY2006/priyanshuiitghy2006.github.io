{{- define "main" }}
{{- $url := site.Params.resumeUrl }}
{{- $name := site.Params.resumeFilename | default "resume.pdf" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title entry-hint-parent">{{ .Title }}</h1>
  </header>

  <p class="resume-actions">
    <a class="resume-btn" href="{{ $url }}?download={{ $name }}" rel="noopener">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12"></path><path d="M7 11l5 5 5-5"></path><path d="M5 21h14"></path>
      </svg>
      Download CV
    </a>
  </p>

  <iframe class="resume-preview" src="{{ $url }}#view=FitH" title="Resume preview" loading="lazy"></iframe>
</article>
{{- end }}
