{{- define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title entry-hint-parent">{{ .Title }}</h1>
  </header>

  <ol class="ach-list" id="ach-list" data-url="{{ site.Params.supabaseUrl }}" data-key="{{ site.Params.supabaseanonkey }}">
    <li class="ach-status">Loading...</li>
  </ol>
  <noscript><p class="ach-status">Turn on JavaScript to see the achievements.</p></noscript>
  <script defer src="{{ "js/achievements-live.js" | relURL }}"></script>
</article>
{{- end }}
