# Override at build time for other hosts, e.g. `hugo --baseURL https://example.netlify.app/`
baseURL: "https://priyanshudebnath.me/"
locale: en-us
title: Priyanshu Debnath
theme: PaperMod

enableRobotsTXT: true
enableEmoji: true
pagination:
  pagerSize: 2

outputs:
  home: [HTML, RSS, JSON]

# Keep the feed at the same URL the previous site used.
outputFormats:
  RSS:
    baseName: feed

privacy:
  youtube:
    privacyEnhanced: true

taxonomies:
  tag: tags

params:
  env: production
  description: "Competitive programming, systems and algorithms by Priyanshu Debnath, IIT Guwahati."
  author: Priyanshu Debnath
  defaultTheme: auto
  DateFormat: "January 2, 2006"
  mainSections: [posts]

  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowShareButtons: false
  disableSpecial1stPost: true

  # Public Supabase Storage URL for the admin-managed CV (bucket "resume", file "cv.pdf").
  resumeUrl: "https://vadbagtnekrjwrimvgxe.supabase.co/storage/v1/object/public/resume/cv.pdf"
  resumeFilename: "Priyanshu_Debnath_CV.pdf"

  # Public (anon) Supabase API, used by the Achievements page to pick up edits
  # made in the admin. The key is injected at build time (HUGO_PARAMS_SUPABASEANONKEY).
  supabaseUrl: "https://vadbagtnekrjwrimvgxe.supabase.co"

  homeInfoParams:
    Title: "Priyanshu Debnath"
    Content: >-
      Sophomore B.Tech student in Electronics and Electrical Engineering
      (Mathematics minor) at IIT Guwahati. Codeforces Expert who spends most
      days doing a bit of cp, exploring c++ in depth, and occasionally
      touching grass. This is where I write about it.

  socialIcons:
    - name: github
      url: "https://github.com/PriyanshuIITGHY2006"
    - name: linkedin
      url: "https://linkedin.com/in/priyanshu-debnath-3a81711b3"
    - name: codeforces
      url: "https://codeforces.com/profile/PriyanshuIITGHY2006"
    - name: discord
      url: "https://discord.com/users/priyanshu_32718"
    - name: email
      url: "mailto:priyanshuib01@gmail.com"
    - name: rss
      url: "https://priyanshudebnath.me/feed.xml"

  assets:
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"
    disableHLJS: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Posts
      pageRef: /posts
      weight: 10
    - identifier: achievements
      name: Achievements
      pageRef: /achievements
      weight: 25
    - identifier: resume
      name: Resume
      pageRef: /resume
      weight: 30
    - identifier: archive
      name: Archive
      pageRef: /archive
      weight: 40
    - identifier: search
      name: Search
      pageRef: /search
      weight: 50
    - identifier: tags
      name: Tags
      pageRef: /tags
      weight: 60

markup:
  highlight:
    noClasses: false
    lineNos: false
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]
    renderer:
      unsafe: true
